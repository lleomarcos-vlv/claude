<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boyd Turismo Tour — Sistema de Gestão</title>
<style>
:root{
  --bg:#0b1410; --bg2:#0f1d17; --panel:#132720; --panel2:#173027; --line:#1f4438;
  --txt:#e6fff6; --muted:#8fb3a6; --acc:#5fe3bd; --acc2:#7ef0d0; --acc-d:#0b3d31;
  --ok:#3ddc97; --warn:#ffc857; --bad:#ff6b6b; --info:#5bc0eb;
  --r:12px; --sh:0 6px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f2f7f5; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef6f3; --line:#d5e6e0;
  --txt:#0d2b22; --muted:#5c7c72; --acc:#0e9e7c; --acc2:#0b7f63; --acc-d:#d8f5ec;
  --sh:0 6px 20px rgba(10,50,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;flex:none}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.3px;line-height:1.15}
.brand small{color:var(--muted);font-size:11px;font-weight:500}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav .grp{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--txt);font-weight:500;cursor:pointer;position:relative}
.nav a .ic{width:20px;text-align:center;font-size:15px;flex:none}
.nav a:hover{background:var(--panel)}
.nav a.on{background:var(--acc-d);color:var(--acc2);font-weight:700}
.nav a .cnt{margin-left:auto;background:var(--panel2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
.side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h2{font-size:18px;font-weight:700}
.top .sub{color:var(--muted);font-size:12px}
.top .sp{flex:1}
.content{padding:20px;max-width:1500px;width:100%}
.burger{display:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}

/* ---------- components ---------- */
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04241c;border:none}
.btn.pri:hover{filter:brightness(1.08);color:#04241c}
.btn.dan:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.gh{background:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.kpi .lb{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.kpi .vl{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .ft{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.ok:before{background:var(--ok)}.kpi.warn:before{background:var(--warn)}.kpi.bad:before{background:var(--bad)}.kpi.info:before{background:var(--info)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:5px;justify-content:flex-end}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty .ico{font-size:34px;opacity:.5;display:block;margin-bottom:8px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.tag.acc{background:var(--acc-d);color:var(--acc2)}

.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.ok{background:var(--ok)}

.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{resize:vertical;min-height:70px}
.fld .hint{font-size:11px;color:var(--muted)}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.fr .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.chk input{width:16px;height:16px;accent-color:var(--acc)}

.bar-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar-tools input,.bar-tools select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none}
.bar-tools input:focus,.bar-tools select:focus{border-color:var(--acc)}
.bar-tools .sp{flex:1}
.search{min-width:210px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:100;padding:20px;overflow:auto}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;box-shadow:var(--sh);margin:auto;animation:pop .16s ease}
.modal .box.wide{max-width:960px}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
.modal .hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .hd h3{font-size:16px;font-weight:700;flex:1}
.modal .bd{padding:18px;max-height:70vh;overflow:auto}
.modal .ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.x:hover{color:var(--bad)}

#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:11px 15px;box-shadow:var(--sh);animation:sl .2s ease;max-width:330px;font-weight:600}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
@keyframes sl{from{transform:translateX(30px);opacity:0}}

.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{background:transparent;border:none;padding:6px 11px;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted)}
.lang button.on{background:var(--acc-d);color:var(--acc2)}

.pax-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
.list-min{display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:10px;align-items:center;padding:9px 11px;background:var(--panel2);border-radius:10px}
.li .ttl{font-weight:700}
.li .sb{font-size:11.5px;color:var(--muted)}
.li .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.b{font-weight:700}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--bad);font-weight:700}
.center{text-align:center}
.mt{margin-top:14px}
.chart{width:100%;height:210px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.seatmap{display:flex;flex-wrap:wrap;gap:5px;max-width:100%}
.seat{width:30px;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted)}
.seat.tk{background:var(--acc-d);color:var(--acc2);border-color:var(--acc)}
.step{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;z-index:60;width:250px;transition:.2s;box-shadow:var(--sh)}
  .side.open{left:0}
  .burger{display:block}
  .content{padding:14px}
  .top{padding:10px 14px}
}
@media print{
  .side,.top,.bar-tools,.acts,.btn,#toast{display:none!important}
  body,.card,.tw{background:#fff!important;color:#000!important}
  .content{padding:0;max-width:100%}
  th,td{border-color:#ccc!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">🚌</div>
      <div>
        <h1 id="brandName">BOYD TURISMO TOUR</h1>
        <small data-i18n="app.sub">Sistema de Gestão</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="lang">
        <button id="lgPt" onclick="setLang('pt')">PT</button>
        <button id="lgEn" onclick="setLang('en')">EN</button>
      </div>
      <button class="btn sm gh" onclick="toggleTheme()" title="Tema / Theme">🌓</button>
      <button class="btn sm gh" onclick="go('settings')" title="⚙">⚙</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div>
        <h2 id="pgTitle">Dashboard</h2>
        <div class="sub" id="pgSub"></div>
      </div>
      <div class="sp"></div>
      <div id="topActions"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

function formHTML(fields,rec){
 return `<div class="fr">`+fields.map(f=>{
  const v=rec[f.k]??f.def??"";
  const cls=f.full?"fld full":"fld";
  if(f.type==="check") return `<div class="chk"><input type="checkbox" id="fld_${f.k}" ${v?"checked":""}><label for="fld_${f.k}">${t(f.t)}</label></div>`;
  let inp;
  if(f.type==="textarea") inp=`<textarea id="fld_${f.k}">${esc(v)}</textarea>`;
  else if(f.type==="select"){ const o=typeof f.opts==="function"?f.opts():f.opts; inp=`<select id="fld_${f.k}">${sel(o,v,f.ph||t("c.none"))}</select>`; }
  else inp=`<input id="fld_${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${f.step?`step="${f.step}"`:""} ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
  return `<div class="${cls}"><label>${t(f.t)}${f.req?" *":""}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
 }).join("")+`</div>`;
}
function readForm(fields){
 const o={},miss=[];
 fields.forEach(f=>{ const e=document.getElementById("fld_"+f.k); if(!e)return;
   let v=f.type==="check"?e.checked:e.value;
   if(f.type==="number")v=num(v);
   if(f.req&&(v===""||v===null))miss.push(t(f.t)); o[f.k]=v; });
 if(miss.length){toast(t("c.required")+" "+miss.join(", "),"bad");return null;}
 return o;
}

VIEWS.dashboard=function(){

 const bkMonth=bkAll.filter(b=>ym(b.createdAt)===m);
 const revMonth=S.finance.filter(f=>f.type==="in"&&ym(f.date)===m).reduce((s,f)=>s+num(f.amount),0)
   + bkAll.reduce((s,b)=>s+(b.payments||[]).filter(p=>ym(p.date)===m).reduce((x,p)=>x+num(p.amount),0),0);
 const expMonth=S.finance.filter(f=>f.type==="out"&&ym(f.date)===m).reduce((s,f)=>s+num(f.amount),0);
 const toRecv=bkAll.reduce((s,b)=>s+Math.max(0,bookBal(b)),0);
 const next=S.departures.filter(d=>["scheduled","confirmed","boarding"].includes(d.status)&&daysTo(d.date)>=0)
   .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 const paxMonth=bkMonth.reduce((s,b)=>s+(b.pax||[]).length,0);
 const occs=next.slice(0,12).map(d=>depOcc(d));
 const avgOcc=occs.length?Math.round(occs.reduce((a,b)=>a+b,0)/occs.length):0;

 /* alertas */
 const al=[];
 next.forEach(d=>{ const dt=daysTo(d.date),oc=depOcc(d);
   if(dt<=7&&oc<50) al.push({k:"warn",txt:`${routeName(d.routeId)} — ${t("d.lowOcc")} (${oc}%) · ${t("d.depIn")} ${dt} ${t("d.days")}`,go:`openDeparture('${d.id}')`});
   if(depFree(d)===0) al.push({k:"info",txt:`${routeName(d.routeId)} · ${fdate(d.date)} — ${t("d.noSeats")}`,go:`openDeparture('${d.id}')`}); });
 bkAll.forEach(b=>{ const dep=byId(S.departures,b.departureId);
   if(dep&&daysTo(dep.date)<=3&&bookBal(b)>0.01)
     al.push({k:"bad",txt:`${b.code} · ${custName(b.customerId)} — ${t("d.overduePay")}: ${money(bookBal(b))}`,go:`openBooking('${b.id}')`}); });

 /* gráfico 6 meses */
 const months=[];for(let i=5;i>=0;i--){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-i);months.push(x.toISOString().slice(0,7));}
 const series=months.map(mm=>({m:mm,
   in:S.finance.filter(f=>f.type==="in"&&ym(f.date)===mm).reduce((s,f)=>s+num(f.amount),0)
     +bkAll.reduce((s,b)=>s+(b.payments||[]).filter(p=>ym(p.date)===mm).reduce((x,p)=>x+num(p.amount),0),0),
   out:S.finance.filter(f=>f.type==="out"&&ym(f.date)===mm).reduce((s,f)=>s+num(f.amount),0)
     +S.departures.filter(d=>ym(d.date)===mm).reduce((s,d)=>s+depCost(d),0)}));

 /* top roteiros */
 const top=S.routes.map(r=>{const ds=S.departures.filter(d=>d.routeId===r.id);
   const pax=ds.reduce((s,d)=>s+seatsSold(d.id),0), rev=ds.reduce((s,d)=>s+depRevenue(d.id),0);
   return {r,pax,rev};}).filter(x=>x.pax>0).sort((a,b)=>b.rev-a.rev).slice(0,5);
 const maxRev=Math.max(1,...top.map(x=>x.rev));

 return `
 <div class="grid g4">
  ${kpi("ok","💵",t("d.revMonth"),money(revMonth),`${t("c.expense")}: ${money(expMonth)}`)}
  ${kpi(revMonth-expMonth>=0?"ok":"bad","📈",t("d.result"),money(revMonth-expMonth),t("c.month")+" "+m)}
  ${kpi("warn","⏳",t("d.toReceive"),money(toRecv),`${bkAll.filter(b=>bookBal(b)>0.01).length} ${t("nav.bookings").toLowerCase()}`)}
  ${kpi("info","🎟️",t("d.bookMonth"),bkMonth.length,`${paxMonth} ${t("c.pax").toLowerCase()}`)}
  ${kpi("","🚏",t("d.nextDep"),next.length,next[0]?fdateLong(next[0].date):"—")}
  ${kpi("","👥",t("d.customers"),S.customers.length,`${S.leads.filter(l=>!["won","lost"].includes(l.status)).length} leads`)}
  ${kpi(avgOcc>=70?"ok":avgOcc>=40?"warn":"bad","🪑",t("d.avgOcc"),avgOcc+"%",t("d.nextDep").toLowerCase())}
  ${kpi("","🗺️",t("nav.routes"),S.routes.length,`${S.suppliers.length} ${t("nav.suppliers").toLowerCase()}`)}
 </div>

 <div class="grid g2 mt">
  <div class="card">
   <h3>📊 ${t("d.revChart")}</h3>
   ${chartBars(series)}
   <div class="legend"><span><i style="background:var(--acc)"></i>${t("c.revenue")}</span><span><i style="background:var(--bad)"></i>${t("c.expense")}</span></div>
  </div>
  <div class="card">
   <h3>🔔 ${t("d.alerts")}<span class="sp"></span>${al.length?tag(al.length,"warn"):""}</h3>
   ${al.length?`<div class="list-min">`+al.slice(0,7).map(a=>
     `<div class="li" style="cursor:pointer" onclick="${a.go}"><span class="dot" style="background:var(--${a.k==="bad"?"bad":a.k==="warn"?"warn":"info"})"></span>
      <span>${esc(a.txt)}</span><span class="sp"></span><span class="muted">›</span></div>`).join("")+`</div>`
    :`<div class="empty"><span class="ico">✅</span>${t("d.noAlerts")}</div>`}
  </div>
 </div>

 <div class="grid g2 mt">
  <div class="card">
   <h3>🚏 ${t("d.nextDep")}<span class="sp"></span><button class="btn sm gh" onclick="go('departures')">${t("a.view")} ›</button></h3>
   <div class="tw" style="border:none">
   <table><thead><tr><th>${t("c.date")}</th><th>${t("c.route")}</th><th>${t("c.occupancy")}</th><th class="num">${t("c.revenue")}</th></tr></thead>
   <tbody>${next.length?next.slice(0,6).map(d=>`<tr style="cursor:pointer" onclick="openDeparture('${d.id}')">
     <td><b>${fdate(d.date)}</b><br><small class="muted">${esc(d.time||"")} · ${daysTo(d.date)}d</small></td>
     <td>${esc(routeName(d.routeId))}<br><small class="muted">${seatsSold(d.id)}/${seatsTotal(d)} ${t("c.seats").toLowerCase()}</small></td>
     <td>${bar(depOcc(d))}</td><td class="num b">${money(depRevenue(d.id))}</td></tr>`).join(""):emptyRow(4)}</tbody></table></div>
  </div>
  <div class="card">
   <h3>🏆 ${t("d.topRoutes")}</h3>
   ${top.length?`<div class="list-min">`+top.map(x=>`<div class="li"><div style="flex:1">
     <div class="ttl">${esc(x.r.name)}</div>
     <div class="bar" style="margin-top:6px"><i style="width:${pct(x.rev,maxRev)}%"></i></div>
     <div class="sb">${x.pax} ${t("c.pax").toLowerCase()}</div></div>
     <b>${money(x.rev)}</b></div>`).join("")+`</div>`:`<div class="empty"><span class="ico">📊</span>${t("c.empty")}</div>`}
  </div>
 </div>`;
};
function kpi(k,ic,lb,vl,ft){return `<div class="kpi ${k}"><div class="lb">${ic} ${esc(lb)}</div><div class="vl">${esc(vl)}</div><div class="ft">${esc(ft||"")}</div></div>`;}
function chartBars(series){
 const W=560,H=200,pad=30,max=Math.max(1,...series.flatMap(s=>[s.in,s.out]));
 const bw=(W-pad*2)/series.length;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" x2="${W-5}" y1="${pad+(H-pad*1.6)*f}" y2="${pad+(H-pad*1.6)*f}" stroke="var(--line)" stroke-width="1"/>`).join("")}
  ${series.map((s,i)=>{const x=pad+i*bw, h=H-pad*1.6;
    const hi=s.in/max*h, ho=s.out/max*h;
    return `<rect x="${x+bw*.16}" y="${pad+h-hi}" width="${bw*.3}" height="${Math.max(1,hi)}" fill="var(--acc)" rx="3"/>
            <rect x="${x+bw*.52}" y="${pad+h-ho}" width="${bw*.3}" height="${Math.max(1,ho)}" fill="var(--bad)" opacity=".8" rx="3"/>
            <text x="${x+bw*.42}" y="${H-8}" fill="var(--muted)" font-size="10" text-anchor="middle">${s.m.slice(5)}/${s.m.slice(2,4)}</text>`;}).join("")}
  <text x="${pad}" y="16" fill="var(--muted)" font-size="10">${money(max)}</text></svg>`;
}

 const cells=[];for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);cells.push(dt);}
 const evs=iso=>[
   ...S.departures.filter(d=>d.date===iso).map(d=>({k:"acc",l:`🚏 ${routeName(d.routeId)}`,go:`openDeparture('${d.id}')`})),

   ...S.leads.filter(l=>l.nextAction===iso&&!["won","lost"].includes(l.status)).map(l=>({k:"warn",l:`🎯 ${l.name}`,go:`go('leads')`}))
 ];
 const wd=S.settings.lang==="en"?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
 const label=new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(first);
 return `<div class="bar-tools">
   <button class="btn" onclick="setF('month','${shiftMonth(base,-1)}')">‹</button>
   <b style="text-transform:capitalize;min-width:170px;text-align:center">${label}</b>
   <button class="btn" onclick="setF('month','${shiftMonth(base,1)}')">›</button>
   <button class="btn gh" onclick="setF('month','${ym(today())}')">${t("c.today")}</button><span class="sp"></span>
   <button class="btn pri" onclick="openDeparture()">+ ${t("nav.departures")}</button></div>

   ${wd.map(d=>`<div class="muted b center" style="font-size:11px;padding:4px">${d}</div>`).join("")}
   ${cells.map(dt=>{const iso=dt.toISOString().slice(0,10),out=dt.getMonth()!==mo-1,ev=evs(iso);
     return `<div style="min-height:88px;border:1px solid var(--line);border-radius:9px;padding:6px;opacity:${out?.4:1};background:${iso===today()?"var(--acc-d)":"transparent"}">
       <div class="b" style="font-size:12px">${dt.getDate()}</div>
       ${ev.slice(0,3).map(e=>`<div class="tag ${e.k}" style="display:block;margin-top:3px;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="${e.go}">${esc(e.l)}</div>`).join("")}
       ${ev.length>3?`<small class="muted">+${ev.length-3}</small>`:""}</div>`;}).join("")}
  </div></div>`;
};
function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return d.toISOString().slice(0,7);}

function ledger(){
 const L=[];
 S.bookings.filter(b=>b.status!=="cancelled").forEach(b=>{
  (b.payments||[]).forEach((p,i)=>L.push({date:p.date,type:"in",category:t("nav.bookings"),
    description:`${b.code} · ${custName(b.customerId)}`,amount:num(p.amount),method:p.method,status:"paid",
    ref:"booking",refId:b.id,idx:i,locked:true}));
  const bal=bookBal(b); if(bal>0.009){const dep=byId(S.departures,b.departureId);
    L.push({date:dep?dep.date:b.createdAt,type:"in",category:t("d.toReceive"),
     description:`${b.code} · ${custName(b.customerId)}`,amount:bal,method:"",status:"pending",ref:"booking",refId:b.id,locked:true});}
 });
 S.departures.filter(d=>d.status!=="cancelled").forEach(d=>{const c=depCost(d);
  if(c>0)L.push({date:d.date,type:"out",category:t("c.supplier"),description:`${routeName(d.routeId)} · ${supName(d.supplierId)}`,
   amount:c,method:"",status:daysTo(d.date)<0?"paid":"pending",ref:"departure",refId:d.id,locked:true});});
 S.finance.forEach(f=>L.push({date:f.date,type:f.type,category:f.category,description:f.description,amount:num(f.amount),
   method:f.method,status:f.status||"paid",ref:"manual",refId:f.id,locked:false}));
 return L.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
const FI_FIELDS=()=>[
 {k:"date",t:"c.date",type:"date",req:true},
 {k:"type",t:"f.entryType",type:"select",opts:()=>[{v:"in",l:t("f.in")},{v:"out",l:t("f.out")}],req:true},
 {k:"amount",t:"c.value",type:"number",step:"0.01",req:true},
 {k:"category",t:"c.category",ph:"Combustível, Pedágio, Marketing..."},
 {k:"method",t:"c.method",type:"select",opts:OPT.payMethod},
 {k:"status",t:"c.status",type:"select",opts:()=>[{v:"paid",l:t("st.paid")},{v:"pending",l:t("st.pending")}]},
 {k:"description",t:"c.description",full:true}];
function finForm(f){crudModal((f?t("a.edit"):t("a.new"))+" · "+t("nav.finance"),FI_FIELDS(),f||{date:today(),type:"out",status:"paid",method:"pix"},
 d=>saveEntity("finance",f,d,"fin"),true);}

VIEWS.finance=function(){
 const per=F.per||ym(today()), ty=F.ty||"", stt=F.stt||"";
 let L=ledger();
 if(per!=="all")L=L.filter(x=>ym(x.date)===per);
 if(ty)L=L.filter(x=>x.type===ty);
 if(stt)L=L.filter(x=>x.status===stt);
 L=L.filter(x=>hit({a:x.description,b:x.category},["a","b"]));
 const inP=L.filter(x=>x.type==="in"&&x.status==="paid").reduce((s,x)=>s+x.amount,0);
 const outP=L.filter(x=>x.type==="out"&&x.status==="paid").reduce((s,x)=>s+x.amount,0);
 const inF=L.filter(x=>x.type==="in"&&x.status!=="paid").reduce((s,x)=>s+x.amount,0);
 const outF=L.filter(x=>x.type==="out"&&x.status!=="paid").reduce((s,x)=>s+x.amount,0);
 const months=[];for(let i=0;i<12;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7));}
 return tools(`${searchBox()}
  <select onchange="setF('per',this.value)">${sel([{v:"all",l:t("a.all")},...months.map(m=>({v:m,l:m}))],per)}</select>
  <select onchange="setF('ty',this.value)">${sel([{v:"in",l:t("f.in")},{v:"out",l:t("f.out")}],ty,t("f.entryType")+": "+t("a.all"))}</select>
  <select onchange="setF('stt',this.value)">${sel([{v:"paid",l:t("st.paid")},{v:"pending",l:t("st.pending")}],stt,t("c.status")+": "+t("a.all"))}</select>
  <span class="sp"></span><button class="btn" onclick="exportCSV('ledger')">⬇ ${t("a.csv")}</button>
  <button class="btn" onclick="window.print()">🖨</button>
  <button class="btn pri" onclick="finForm()">+ ${t("a.new")}</button>`)+
 `<div class="grid g4" style="margin-bottom:14px">
   ${kpi("ok","⬆️",t("f.in"),money(inP),`${t("st.pending")}: ${money(inF)}`)}
   ${kpi("bad","⬇️",t("f.out"),money(outP),`${t("st.pending")}: ${money(outF)}`)}
   ${kpi(inP-outP>=0?"ok":"bad","💰",t("c.result"),money(inP-outP),t("st.paid"))}
   ${kpi("warn","📅",t("c.balance"),money(inP-outP+inF-outF),t("st.open"))}
  </div>
 <div class="tw"><table><thead><tr><th>${t("c.date")}</th><th>${t("c.description")}</th><th>${t("c.category")}</th>
  <th>${t("c.method")}</th><th>${t("c.status")}</th><th class="num">${t("c.value")}</th><th></th></tr></thead><tbody>
 ${L.length?L.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.description||"")}
   <br><small class="muted">${x.ref==="manual"?t("a.edit"):t("nav."+(x.ref==="booking"?"bookings":"departures"))}</small></td>
  <td>${esc(x.category||"—")}</td><td>${x.method?tag(t("pm."+x.method),"acc"):"—"}</td>
  <td>${tag(t("st."+x.status),stKind(x.status))}</td>
  <td class="num ${x.type==="in"?"pos":"neg"}">${x.type==="in"?"+":"−"} ${money(x.amount)}</td>
  <td><div class="acts">${x.ref==="manual"?`<button class="btn sm" onclick="finForm(byId(S.finance,'${x.refId}'))">✏️</button>
   <button class="btn sm dan" onclick="delEntity('finance','${x.refId}')">🗑</button>`
   :`<button class="btn sm" onclick="${x.ref==="booking"?`openBooking('${x.refId}')`:`openDeparture('${x.refId}')`}">↗</button>`}</div></td></tr>`).join(""):emptyRow(7)}
 </tbody></table></div>`;
};

   <div class="fr">
    <div class="fld full"><label>${t("f.company")}</label><input id="co_name" value="${esc(c.name||"")}"></div>
    <div class="fld"><label>${t("f.cnpj")}</label><input id="co_cnpj" value="${esc(c.cnpj||"")}"></div>
    <div class="fld"><label>${t("c.phone")}</label><input id="co_phone" value="${esc(c.phone||"")}"></div>
    <div class="fld"><label>${t("c.email")}</label><input id="co_email" value="${esc(c.email||"")}"></div>
    <div class="fld"><label>${t("p.emergency")}</label><input id="co_emergency" value="${esc(c.emergency||"")}"></div>
    <div class="fld full"><label>${t("c.address")}</label><input id="co_address" value="${esc(c.address||"")}"></div>
   </div>
   <div class="acts mt"><button class="btn pri" onclick="saveCompany()">💾 ${t("a.save")}</button></div></div>

  <div class="card"><h3>🎛️ ${t("s.pref")}</h3>
   <div class="fr">
    <div class="fld"><label>${t("f.lang")}</label><select onchange="setLang(this.value)">
      ${sel([{v:"pt",l:"Português (BR)"},{v:"en",l:"English (US)"}],S.settings.lang)}</select></div>
    <div class="fld"><label>${t("f.theme")}</label><select onchange="S.settings.theme=this.value;save();render()">
      ${sel([{v:"dark",l:"Dark"},{v:"light",l:"Light"}],S.settings.theme)}</select></div>
    <div class="fld"><label>${t("f.currency")}</label><select onchange="S.settings.currency=this.value;save();render()">
      ${sel([{v:"BRL",l:"BRL (R$)"},{v:"USD",l:"USD ($)"},{v:"EUR",l:"EUR (€)"},{v:"ARS",l:"ARS ($)"},{v:"PYG",l:"PYG (₲)"}],S.settings.currency)}</select></div>
   </div>
   <h3 class="mt">ℹ️ ${t("s.about")}</h3><p class="muted">${t("s.aboutTxt")}</p>
   <div class="step mt">${counts.map(([k,l])=>`${tag(t(l)+": "+(S[k]||[]).length,"acc")}`).join(" ")}</div>
   <p class="muted mt">${t("s.storage")}: <b>${size} KB</b></p></div>

  <div class="card"><h3>💾 ${t("s.data")}</h3>
   <p class="muted">${S.settings.lang==="en"?"All data lives in this browser. Export a backup regularly and keep the file safe.":"Todos os dados ficam neste navegador. Exporte um backup com frequência e guarde o arquivo."}</p>
   <div class="acts mt" style="justify-content:flex-start;flex-wrap:wrap">
    <button class="btn pri" onclick="backupExport()">⬇ ${t("s.exportAll")}</button>
    <button class="btn" onclick="document.getElementById('impFile').click()">⬆ ${t("s.importAll")}</button>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="backupImport(this)">
    <button class="btn" onclick="exportCSV('bookings')">⬇ ${t("nav.bookings")} CSV</button>
    <button class="btn" onclick="loadDemo()">🎲 ${t("s.demo")}</button>
    <button class="btn dan" onclick="resetAll()">🗑 ${t("s.reset")}</button>
   </div></div>

  <div class="card"><h3>🚀 ${S.settings.lang==="en"?"Quick start":"Primeiros passos"}</h3>
   <div class="list-min">
    ${[["🗺️",t("nav.routes"),"routes"],["🤝",t("nav.suppliers"),"suppliers"],["🚐",t("nav.vehicles"),"vehicles"],
      ["🚏",t("nav.departures"),"departures"],["👥",t("nav.customers"),"customers"],["🎟️",t("nav.bookings"),"bookings"],
      ["💰",t("nav.finance"),"finance"]].map((x,i)=>
     `<div class="li" style="cursor:pointer" onclick="go('${x[2]}')"><b style="width:20px">${i+1}</b><span>${x[0]}</span>
      <span class="ttl">${esc(x[1])}</span><span class="sp"></span><span class="muted">›</span></div>`).join("")}
   </div></div>
 </div>`;
};
function saveCompany(){["name","cnpj","phone","email","emergency","address"].forEach(k=>{
  const e=document.getElementById("co_"+k);if(e)S.settings.company[k]=e.value;});
 save();render();toast(t("c.saved"));}
function dl(name,txt,mime){const b=new Blob([txt],{type:mime||"application/json;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function backupExport(){dl(`boyd-backup-${today()}.json`,JSON.stringify(S,null,1));toast(t("s.exportAll")+" ✓");}
function backupImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;S=d;save();render();toast(t("s.imported"));}
 catch(e){toast(t("s.invalidFile"),"bad");}};r.readAsText(f);inp.value="";}
function loadDemo(){confirmBox(t("s.demo")+"?",()=>{S=DEFAULTS();seed();save();go("dashboard");toast(t("c.saved"));});}
function resetAll(){confirmBox(t("s.resetWarn"),()=>{S=DEFAULTS();save();go("dashboard");toast(t("c.deleted"));});}

function exportCSV(what){
 const M={
  routes:()=>[["Nome","Origem","Destino","UF","Tipo","KM","Horas","Adulto","Crianca","Inclui"],
    S.routes.map(r=>[r.name,r.origin,r.destination,r.state,t("ty."+(r.type||"excursion")),r.km,r.hours,r.priceAdult,r.priceChild,r.includes])],
  departures:()=>[["Data","Volta","Roteiro","Veiculo","Fornecedor","Lugares","Vendidos","Ocupacao%","Receita","Custo","Resultado","Status"],
    S.departures.map(d=>[d.date,d.retDate,routeName(d.routeId),vehLabel(d.vehicleId),supName(d.supplierId),seatsTotal(d),
      seatsSold(d.id),depOcc(d),depRevenue(d.id),depCost(d),depRevenue(d.id)-depCost(d),t("st."+d.status)])],
  bookings:()=>[["Codigo","Data","Cliente","Roteiro","Partida","Pax","Total","Pago","Saldo","Status"],
    S.bookings.map(b=>{const d=byId(S.departures,b.departureId);
      return [b.code,b.createdAt,custName(b.customerId),d?routeName(d.routeId):"",d?d.date:"",(b.pax||[]).length,
        bookTotal(b),bookPaid(b),bookBal(b),t("st."+b.status)];})],
  customers:()=>[["Nome","Documento","Telefone","Email","Cidade","Reservas","Total"],
    S.customers.map(c=>{const bs=S.bookings.filter(b=>b.customerId===c.id);
      return [c.name,c.doc,c.phone,c.email,c.city,bs.length,bs.reduce((s,b)=>s+bookTotal(b),0)];})],
  leads:()=>[["Nome","Telefone","Origem","Interesse","Pax","Status","Proxima acao"],
    S.leads.map(l=>[l.name,l.phone,l.source,routeName(l.routeId),l.pax,t("st."+l.status),l.nextAction])],
  suppliers:()=>[["Nome","Tipo","Contato","Telefone","Telefone 2","Email","Endereco","Frota"],
    S.suppliers.map(s=>[s.name,t("ty."+s.type),s.contact,s.phone,s.phone2,s.email,s.address,s.fleet])],
  ledger:()=>[["Data","Tipo","Categoria","Descricao","Forma","Status","Valor"],
    ledger().map(x=>[x.date,x.type==="in"?"Entrada":"Saida",x.category,x.description,x.method?t("pm."+x.method):"",t("st."+x.status),x.amount])]
 };
 const [head,rows]=M[what]();
 const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 dl(`boyd-${what}-${today()}.csv`,"﻿"+[head.map(q).join(";"),...rows.map(r=>r.map(q).join(";"))].join("\n"),"text/csv;charset=utf-8");
 toast("CSV ✓");
}

/* ============================================================
   BOOT
   ============================================================ */
load();
render();
window.addEventListener("beforeunload",save);
</script>
</body>
</html>
