name: jardimja_mobile
description: JardimJá — apps mobile (Cliente + Profissional) do "Uber da Jardinagem".
publish_to: "none"
version: 1.0.0+1

# One codebase, two apps via flavors:
#   flutter run --flavor client       -t lib/main_client.dart
#   flutter run --flavor professional -t lib/main_professional.dart

environment:
  # Dart 3.6 / Flutter 3.27 — the theme uses the `Color.withValues` API.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure token storage (keychain / keystore)
  flutter_secure_storage: ^9.2.2

  # Maps (keys provided via --dart-define + native config)
  google_maps_flutter: ^2.6.1

  # Camera / gallery capture
  image_picker: ^1.1.2

  # Currency + date formatting (pt-BR)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Per-flavor assets. Drop a flavor logo / splash into each folder; the app
  # picks them up per build flavor. `.gitkeep` keeps the empty dirs valid.
  assets:
    - assets/
    - assets/client/
    - assets/professional/

  # To ship the brand font, add the Inter files under assets/fonts/ and
  # uncomment. The theme already references `Inter`; without the files Flutter
  # falls back to the platform default gracefully.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
