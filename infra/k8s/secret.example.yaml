# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE ONLY — do NOT commit real secrets.
#
# In a real cluster, do not apply plaintext Secrets. Use one of:
#   • External Secrets Operator (pulls from AWS Secrets Manager / SSM)
#   • Sealed Secrets (bitnami-labs) — encrypted, safe to commit
#   • SOPS + age
#
# The keys below mirror .env.example. `stringData` lets you paste raw values
# (Kubernetes base64-encodes them for you) when creating a Secret manually.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: jardimja
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: jardimja
type: Opaque
stringData:
  DATABASE_URL: "postgresql://jardimja:CHANGE_ME@postgres:5432/jardimja?schema=public"
  REDIS_URL: "rediss://redis:6379"
  JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  S3_ENDPOINT: "https://s3.sa-east-1.amazonaws.com"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  MERCADOPAGO_ACCESS_TOKEN: ""
  MERCADOPAGO_WEBHOOK_SECRET: ""
  FCM_PROJECT_ID: ""
  FCM_CLIENT_EMAIL: ""
  FCM_PRIVATE_KEY: ""
