# Nginx do frontend: serve o SPA (React/Vite) e faz proxy de /api para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend (rede interna do compose). Sem CORS: mesma origem para o browser.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html (roteamento no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
