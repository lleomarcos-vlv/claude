<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#14110D; --bg2:#1A1610; --card:#1F1A14; --border:#3A3128;
  --text:#F5EFE6; --dim:#A89F91; --primary:#D9A441; --primaryDark:#B8862F;
  --onPrimary:#1C1508; --accent:#F0C066; --chip:#2B2318;
  --ok:#59B87F; --okBg:#1B2E23; --warn:#E0A831; --warnBg:#332A17;
  --danger:#E06056; --dangerBg:#33201D;
}
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  line-height: 1.45;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea {
  font: inherit; color: var(--text);
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 11px 13px;
  width: 100%;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
input[type="checkbox"] { width: auto; accent-color: var(--primary); }
label.fld { display: block; font-size: 13px; color: var(--dim); font-weight: 600; margin: 12px 0 5px; }
a { color: var(--accent); }

.wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 110px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}
.card h2 { font-size: 17px; margin-bottom: 10px; }
.muted { color: var(--dim); font-size: 13px; }
.small { font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; }
.right { margin-left: auto; }
.center { text-align: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: var(--onPrimary);
  border-radius: 14px; padding: 13px 18px;
  font-weight: 700; font-size: 15px;
  transition: transform .06s ease, filter .15s;
  text-decoration: none;
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.big { padding: 16px 20px; font-size: 17px; border-radius: 16px; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn.soft { background: var(--chip); color: var(--text); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { background: var(--dangerBg); color: var(--danger); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
}
.chip.ok { background: var(--okBg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warnBg); color: var(--warn); border-color: transparent; }
.chip.danger { background: var(--dangerBg); color: var(--danger); border-color: transparent; }

.badge {
  background: var(--danger); color: #fff; border-radius: 999px;
  font-size: 11px; font-weight: 800; min-width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
}

/* cabeçalho com foto */
.header { display: flex; align-items: center; gap: 14px; padding: 18px 4px 14px; }
.avatar {
  width: 74px; height: 74px; border-radius: 50%;
  border: 3px solid var(--primary);
  object-fit: cover; background: var(--chip);
  display: flex; align-items: center; justify-content: center; font-size: 36px;
  flex: none;
}
.header h1 { font-size: 21px; line-height: 1.2; }
.header .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); margin-top: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.sync-dot.online { background: var(--ok); }
.sync-dot.local { background: var(--warn); }

/* faixas de aviso */
.banner {
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
  background: var(--warnBg); border: 1px solid var(--border);
  font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
}
.banner .emoji { font-size: 20px; line-height: 1; }

/* seletor de dias (fita horizontal) */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day {
  flex: none; width: 64px; padding: 10px 4px; text-align: center;
  background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px;
}
.day .wd { font-size: 11px; color: var(--dim); text-transform: uppercase; font-weight: 700; }
.day .dn { font-size: 19px; font-weight: 800; margin-top: 2px; }
.day.sel { background: var(--primary); border-color: var(--primary); }
.day.sel .wd, .day.sel .dn { color: var(--onPrimary); }
.day.off { opacity: .35; }

/* grade de horários */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot {
  padding: 11px 4px; text-align: center; border-radius: 12px;
  background: var(--bg2); border: 1.5px solid var(--border);
  font-weight: 700; font-size: 14px;
}
.slot.sel { background: var(--primary); color: var(--onPrimary); border-color: var(--primary); }
.slot.busy { opacity: .3; text-decoration: line-through; pointer-events: none; }

/* lista de serviços */
.svc {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 13px; margin-bottom: 9px;
}
.svc.sel { border-color: var(--primary); box-shadow: 0 0 0 1.5px var(--primary) inset; }
.svc .emoji { font-size: 26px; }
.svc .nm { font-weight: 700; font-size: 15px; }
.svc .inf { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.svc .pr { margin-left: auto; font-weight: 800; color: var(--accent); white-space: nowrap; }

/* opções em pílulas (tamanho do pet etc.) */
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt {
  background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px;
  padding: 10px 14px; font-weight: 700; font-size: 14px;
}
.opt.sel { background: var(--primary); color: var(--onPrimary); border-color: var(--primary); }

/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px 22px 0 0; width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto; padding: 20px 18px 26px;
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
.modal h3 { font-size: 18px; margin-bottom: 12px; }
@media (min-width: 560px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: 22px; }
}

/* toasts */
#toasts { position: fixed; top: 12px; left: 0; right: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  background: var(--card); color: var(--text); border: 1px solid var(--primary);
  border-radius: 14px; padding: 11px 16px; font-size: 14px; font-weight: 600;
  max-width: 92%; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(-12px); transition: all .3s ease;
}
.toast.show { opacity: 1; transform: none; }
.toast.ok { border-color: var(--ok); }
.toast.danger { border-color: var(--danger); }

/* abas fixas no rodapé (painel) */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
}
.tab { flex: 1; text-align: center; padding: 6px 2px; border-radius: 12px; position: relative; color: var(--dim); }
.tab .ic { font-size: 21px; display: block; }
.tab .lb { font-size: 10.5px; font-weight: 700; margin-top: 1px; display: block; }
.tab.sel { color: var(--text); background: var(--chip); }
.tab .badge { position: absolute; top: 0; right: 14%; }

/* linhas da agenda do painel */
.ag-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
.ag-time { flex: none; width: 52px; text-align: right; font-weight: 800; font-size: 13.5px; color: var(--dim); padding-top: 12px; }
.ag-body { flex: 1; min-width: 0; }
.ag-free {
  border: 1.5px dashed var(--border); border-radius: 12px; padding: 10px 12px;
  color: var(--dim); font-size: 13px; display: flex; align-items: center; width: 100%; text-align: left;
}
.ag-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px; padding: 11px 12px; }
.ag-card.pendente { border-color: var(--warn); }
.ag-card .nm { font-weight: 800; font-size: 15px; }
.ag-card .inf { color: var(--dim); font-size: 12.5px; margin: 2px 0 8px; }
.ag-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.hero {
  background: linear-gradient(135deg, var(--primary), var(--primaryDark));
  color: var(--onPrimary); border-radius: 20px; padding: 18px; margin-bottom: 14px;
}
.hero .eta { font-size: 26px; font-weight: 900; margin: 2px 0; }
.hero .muted2 { opacity: .8; font-size: 13px; font-weight: 600; }

.list-item { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }

.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; flex: 1; text-align: center; }
.stat .v { font-size: 19px; font-weight: 900; color: var(--accent); }
.stat .l { font-size: 11px; color: var(--dim); font-weight: 700; text-transform: uppercase; }

.steps { display: flex; gap: 6px; margin-bottom: 14px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--border); }
.steps i.on { background: var(--primary); }

.fixed-cta {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 40%);
  max-width: 520px; margin: 0 auto;
}

/* específicos do painel */
.ph-header { display:flex; align-items:center; gap:12px; padding:14px 4px 10px; }
.ph-header .avatar { width:52px; height:52px; font-size:26px; border-width:2px; }
.ph-header h1 { font-size:17px; }
.cert-canvas { width:100%; border-radius:12px; border:1px solid var(--border); }
.prog { height:8px; background:var(--border); border-radius:8px; overflow:hidden; margin-top:6px; }
.prog i { display:block; height:100%; background:var(--primary); border-radius:8px; }
</style>

<script>
/* ============================================================
   MOTOR COMPARTILHADO — utilidades, dados e sincronização
   Sincroniza em tempo real:
   1. mesma aba/navegador  -> BroadcastChannel + localStorage (funciona offline)
   2. outros aparelhos     -> broker MQTT público via internet (wifi com internet)
   ============================================================ */

const CFG = JSON.parse(document.getElementById('app-config').textContent);
(function () {
  const q = new URLSearchParams(location.search).get('loja');
  if (q) CFG.shopId = q.trim();
})();

/* ---------- utilidades ---------- */
const $  = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function digits(s) { return String(s || '').replace(/\D+/g, ''); }
function phoneBR(s) {
  let d = digits(s);
  if (!d) return '';
  if (d.startsWith('0')) d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function fmtPhone(s) {
  const d = digits(s).replace(/^55/, '');
  if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return s || '';
}
function money(v) {
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
const WD  = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WDF = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function todayStr() { return dateToStr(new Date()); }
function dateToStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function strToDate(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = strToDate(s); d.setDate(d.getDate() + n); return dateToStr(d); }
function dateLabel(s) { const d = strToDate(s); return WD[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function dateLabelLong(s) { const d = strToDate(s); return WDF[d.getDay()] + ', dia ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function timeToMin(t) { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function minToTime(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function bookingMoment(b) { const d = strToDate(b.date); d.setMinutes(timeToMin(b.time)); return d.getTime(); }
function humanETA(ms) {
  const min = Math.round(ms / 60000);
  if (min <= 0) return 'agora';
  if (min < 60) return 'em ' + min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return 'em ' + h + 'h' + (m ? String(m).padStart(2, '0') : '');
  const dias = Math.round(h / 24);
  return 'em ' + dias + (dias === 1 ? ' dia' : ' dias');
}
function deviceId() {
  let id = localStorage.getItem('agendapp-device');
  if (!id) { id = uid(); localStorage.setItem('agendapp-device', id); }
  return id;
}
const DEVICE = deviceId();

function waLink(phone, text) {
  const p = phoneBR(phone);
  const t = encodeURIComponent(text || '');
  return p ? 'https://wa.me/' + p + '?text=' + t : 'https://wa.me/?text=' + t;
}
function openWa(phone, text) { window.open(waLink(phone, text), '_blank'); }

/* ---------- toasts + som ---------- */
function toast(msg, kind) {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = msg;
  box.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 4200);
}
function ding() {
  try {
    const ctx = ding.ctx || (ding.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [[880, 0], [1174, .18]].forEach(([f, dt]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(.0001, ctx.currentTime + dt);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + dt + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + dt + .35);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + dt); o.stop(ctx.currentTime + dt + .4);
    });
    if (navigator.vibrate) navigator.vibrate(180);
  } catch (e) {}
}

/* ---------- estado (dados da loja) ---------- */
const Store = {
  key: 'agendapp:' + CFG.shopId,
  state: null,
  listeners: [],

  blank() { return { v: 1, config: { updatedAt: 0 }, bookings: [], announcements: [], blockedDates: [], products: [], sales: [] }; },

  load() {
    try { this.state = Object.assign(this.blank(), JSON.parse(localStorage.getItem(this.key) || '{}')); }
    catch (e) { this.state = this.blank(); }
    ['bookings', 'announcements', 'blockedDates', 'products', 'sales'].forEach(k => { if (!Array.isArray(this.state[k])) this.state[k] = []; });
    if (!this.state.config) this.state.config = { updatedAt: 0 };
    return this.state;
  },

  raw() { return localStorage.getItem(this.key) || ''; },

  save() {
    const corte = addDays(todayStr(), -60);
    this.state.bookings = this.state.bookings.filter(b => b.date >= corte);
    localStorage.setItem(this.key, JSON.stringify(this.state));
  },

  /* mescla dois estados: vence quem tem updatedAt maior, registro a registro */
  mergeStates(a, b) {
    const out = this.blank();
    out.config = ((b.config && b.config.updatedAt) || 0) > ((a.config && a.config.updatedAt) || 0) ? b.config : (a.config || { updatedAt: 0 });
    ['bookings', 'announcements', 'blockedDates', 'products', 'sales'].forEach(k => {
      const map = {};
      (a[k] || []).concat(b[k] || []).forEach(r => {
        if (!r || !r.id) return;
        const cur = map[r.id];
        if (!cur || (r.updatedAt || r.createdAt || 0) >= (cur.updatedAt || cur.createdAt || 0)) map[r.id] = r;
      });
      out[k] = Object.values(map).sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
    });
    return out;
  },

  /* aplica um estado vindo de fora (outra aba / outro aparelho) */
  applyRemote(remote) {
    if (!remote || typeof remote !== 'object') return;
    const merged = this.mergeStates(this.state, remote);
    const mergedStr = JSON.stringify(merged);
    const changedLocal = mergedStr !== JSON.stringify(this.state);
    const remoteMissing = mergedStr !== JSON.stringify(this.mergeStates(remote, remote));
    if (changedLocal) {
      const before = this.state;
      this.state = merged;
      this.save();
      this.listeners.forEach(fn => fn(before));
    }
    if (remoteMissing) Sync.schedulePublish();
  },

  /* mutação local: altera, salva, notifica e publica */
  mutate(fn) {
    fn(this.state);
    this.save();
    this.listeners.forEach(l => l(null));
    Sync.broadcastLocal();
    Sync.schedulePublish();
  },

  onChange(fn) { this.listeners.push(fn); },

  /* configuração efetiva = padrão do arquivo + ajustes feitos no painel */
  cfg() {
    const o = this.state.config || {};
    const c = Object.assign({}, CFG, o);
    c.hours = Object.assign({}, CFG.hours, o.hours || {});
    c.services = (o.services && o.services.length) ? o.services : CFG.services;
    return c;
  },

  products() {
    const map = {};
    (CFG.products || []).forEach(p => map[p.id] = Object.assign({}, p));
    (this.state.products || []).forEach(p => map[p.id] = p);
    return Object.values(map).filter(p => p.active !== false);
  },

  activeAnnouncements() {
    const hoje = todayStr();
    return (this.state.announcements || [])
      .filter(a => a.active !== false && (!a.until || a.until >= hoje))
      .sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
  },

  activeBookings() { return this.state.bookings.filter(b => b.status !== 'cancelado' && b.type !== 'hotel'); },
  hotelRequests()  { return this.state.bookings.filter(b => b.type === 'hotel'); }
};
Store.load();

/* ---------- horários ---------- */
const Slots = {
  isOpen(dateStr) {
    const c = Store.cfg();
    if ((Store.state.blockedDates || []).some(b => b.id === dateStr && b.active !== false)) return false;
    return c.hours.openDays.indexOf(strToDate(dateStr).getDay()) !== -1;
  },
  blockedReason(dateStr) {
    const b = (Store.state.blockedDates || []).find(x => x.id === dateStr && x.active !== false);
    return b ? (b.reason || 'Fechado') : null;
  },
  /* lista de horários do dia com situação de cada um */
  grid(dateStr) {
    const c = Store.cfg();
    const list = [];
    const start = timeToMin(c.hours.start), end = timeToMin(c.hours.end), step = c.hours.slotMinutes || 30;
    for (let m = start; m + step <= end; m += step) list.push({ time: minToTime(m), min: m });
    const dayBookings = Store.activeBookings().filter(b => b.date === dateStr);
    const now = new Date();
    const isToday = dateStr === todayStr();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    list.forEach(s => {
      s.past = isToday && s.min <= nowMin;
      s.booking = dayBookings.find(b => {
        const bs = timeToMin(b.time), be = bs + (b.duration || step);
        return s.min >= bs && s.min < be;
      }) || null;
      s.startsBooking = !!(s.booking && timeToMin(s.booking.time) === s.min);
    });
    return list;
  },
  /* horários livres onde cabe um serviço de `dur` minutos */
  freeFor(dateStr, dur) {
    if (!this.isOpen(dateStr)) return [];
    const c = Store.cfg();
    const step = c.hours.slotMinutes || 30;
    const need = Math.max(1, Math.ceil((dur || step) / step));
    const g = this.grid(dateStr);
    const out = [];
    for (let i = 0; i < g.length; i++) {
      if (g[i].past || g[i].booking) continue;
      let ok = true;
      for (let j = 1; j < need; j++) {
        if (!g[i + j] || g[i + j].booking) { ok = false; break; }
      }
      const endMin = g[i].min + (dur || step);
      if (endMin > timeToMin(c.hours.end)) ok = false;
      if (ok) out.push(g[i].time);
    }
    return out;
  },
  isFree(dateStr, time, dur) { return this.freeFor(dateStr, dur).indexOf(time) !== -1; }
};

/* ---------- sincronização em tempo real ---------- */
const Sync = {
  status: 'local',           // local | conectando | online
  statusListeners: [],
  mqttClient: null,
  channel: null,
  lastRaw: '',
  publishTimer: null,
  topic: 'agendapp/v2/' + CFG.shopId,

  onStatus(fn) { this.statusListeners.push(fn); fn(this.status); },
  setStatus(s) { this.status = s; this.statusListeners.forEach(fn => fn(s)); },

  init() {
    this.lastRaw = Store.raw();
    /* mesma máquina: BroadcastChannel */
    try {
      this.channel = new BroadcastChannel('agendapp-' + CFG.shopId);
      this.channel.onmessage = ev => { if (ev.data && ev.data.state) Store.applyRemote(ev.data.state); };
    } catch (e) {}
    /* mesma máquina: evento de storage + vigia (funciona até em file://) */
    window.addEventListener('storage', ev => { if (ev.key === Store.key) this.pollLocal(); });
    setInterval(() => this.pollLocal(), 2500);
    /* outros aparelhos: MQTT via internet */
    this.connectMqtt();
  },

  pollLocal() {
    const raw = Store.raw();
    if (raw === this.lastRaw) return;
    this.lastRaw = raw;
    try { Store.applyRemote(JSON.parse(raw)); } catch (e) {}
  },

  broadcastLocal() {
    this.lastRaw = Store.raw();
    try { this.channel && this.channel.postMessage({ state: Store.state }); } catch (e) {}
  },

  loadMqttLib(cb) {
    if (window.mqtt) return cb(true);
    const urls = [
      'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
      'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'
    ];
    (function next(i) {
      if (i >= urls.length) return cb(false);
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = () => cb(!!window.mqtt);
      s.onerror = () => next(i + 1);
      document.head.appendChild(s);
    })(0);
  },

  connectMqtt() {
    const self = this;
    this.setStatus('conectando');
    this.loadMqttLib(ok => {
      if (!ok) { self.setStatus('local'); setTimeout(() => self.connectMqtt(), 60000); return; }
      const brokers = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081'];
      let idx = 0, connected = false;

      function tryBroker() {
        if (idx >= brokers.length) { self.setStatus('local'); setTimeout(() => { idx = 0; tryBroker(); }, 45000); return; }
        const url = brokers[idx];
        let settled = false;
        const c = window.mqtt.connect(url, {
          clientId: 'agp_' + DEVICE + '_' + Math.random().toString(16).slice(2, 6),
          clean: true, connectTimeout: 9000, reconnectPeriod: 6000, keepalive: 45
        });
        self.mqttClient = c;
        const giveUp = setTimeout(() => {
          if (!connected && !settled) { settled = true; try { c.end(true); } catch (e) {} idx++; tryBroker(); }
        }, 11000);
        c.on('connect', () => {
          connected = true; settled = true; clearTimeout(giveUp);
          self.setStatus('online');
          c.subscribe(self.topic, { qos: 0 });
          self.schedulePublish();
        });
        c.on('message', (t, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (msg && msg.state) Store.applyRemote(msg.state);
          } catch (e) {}
        });
        c.on('close', () => { if (connected) self.setStatus('conectando'); });
        c.on('error', () => {
          if (!connected && !settled) { settled = true; clearTimeout(giveUp); try { c.end(true); } catch (e) {} idx++; tryBroker(); }
        });
      }
      tryBroker();
    });
  },

  schedulePublish() {
    clearTimeout(this.publishTimer);
    this.publishTimer = setTimeout(() => this.publishNow(), 450);
  },

  publishNow() {
    this.lastRaw = Store.raw();
    if (!this.mqttClient || this.status !== 'online') return;
    try {
      this.mqttClient.publish(this.topic, JSON.stringify({ origin: DEVICE, at: Date.now(), state: Store.state }), { retain: true, qos: 0 });
    } catch (e) {}
  }
};

/* ---------- aparência ---------- */
(function applyTheme() {
  const t = CFG.theme || {};
  const root = document.documentElement;
  Object.keys(t).forEach(k => root.style.setProperty('--' + k, t[k]));
  document.title = document.title.replace('__NOME__', CFG.shopName);
  const fav = document.createElement('link');
  fav.rel = 'icon';
  fav.href = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + (CFG.icon || '📅') + '</text></svg>');
  document.head.appendChild(fav);
  const meta = document.createElement('meta');
  meta.name = 'theme-color';
  meta.content = t.bg || '#111';
  document.head.appendChild(meta);
})();

/* redesenha relógios/contagens de tempo em tempos em tempos */
setInterval(() => { document.dispatchEvent(new CustomEvent('tick')); }, 30000);

function desenharCertidao(d, foto) {
  const c = Store.cfg();
  const W = 1080, H = 1400;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = '#FBF3E4'; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(210,170,110,.12)';
  for (let i = 0; i < 40; i++) { x.font = '38px serif'; x.fillText('🐾', (i * 173) % W, ((i * 271) % H) + 30); }
  const prim = (CFG.theme && CFG.theme.primary) || '#B8862F';
  x.strokeStyle = prim; x.lineWidth = 10; x.strokeRect(36, 36, W - 72, H - 72);
  x.lineWidth = 3; x.strokeRect(56, 56, W - 112, H - 112);
  x.textAlign = 'center';
  x.fillStyle = '#6B4E1E';
  x.font = '600 34px Georgia, serif';
  x.fillText((c.shopName || '').toUpperCase(), W / 2, 140);
  x.fillStyle = '#3C2E14';
  x.font = '800 64px Georgia, serif';
  x.fillText('Certidão de Nascimento', W / 2, 230);
  x.font = '30px Georgia, serif';
  x.fillStyle = '#6B4E1E';
  x.fillText('— ' + (d.especie === 'Gato' ? '🐱' : '🐶') + ' —', W / 2, 285);
  let y = 360;
  if (foto) {
    const r = 130; y = 620;
    x.save(); x.beginPath(); x.arc(W / 2, 470, r, 0, Math.PI * 2); x.clip();
    const s = Math.max(r * 2 / foto.width, r * 2 / foto.height);
    x.drawImage(foto, W / 2 - foto.width * s / 2, 470 - foto.height * s / 2, foto.width * s, foto.height * s);
    x.restore();
    x.beginPath(); x.arc(W / 2, 470, r + 6, 0, Math.PI * 2); x.strokeStyle = prim; x.lineWidth = 8; x.stroke();
  }
  x.fillStyle = '#2A2010';
  x.font = 'italic 900 78px Georgia, serif';
  x.fillText(d.nome, W / 2, y + 60);
  x.font = '30px Georgia, serif';
  x.fillStyle = '#4A3A1C';
  const linhas = [
    d.especie + ' · ' + d.sexo + ' · ' + d.raca,
    d.nasc ? 'Nascido(a) em ' + dateLabelLong(d.nasc) : '',
    d.tutor ? 'Filho(a) de coração de ' + d.tutor : '',
    d.cidade || ''
  ].filter(Boolean);
  linhas.forEach((l, i) => x.fillText(l, W / 2, y + 140 + i * 56));
  x.font = 'italic 26px Georgia, serif';
  x.fillStyle = '#6B4E1E';
  x.fillText('Certificamos, com muito amor, que este pet faz parte da nossa família.', W / 2, H - 220);
  x.strokeStyle = '#6B4E1E'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(W / 2 - 200, H - 150); x.lineTo(W / 2 + 200, H - 150); x.stroke();
  x.font = '26px Georgia, serif';
  x.fillText(c.shopName, W / 2, H - 115);
  const hoje = new Date();
  x.font = '22px Georgia, serif';
  x.fillText((d.cidade ? d.cidade + ', ' : '') + hoje.getDate() + ' de ' + MESES[hoje.getMonth()] + ' de ' + hoje.getFullYear(), W / 2, H - 80);
  return cv.toDataURL('image/png');
}

    const novo = {
      id: id || uid(), emoji: $('#prEmoji').value.trim() || '🛍️', name: nome, price: preco,
      commission: parseFloat($('#prCom').value) || 0, active: true, updatedAt: Date.now()
    };
    Store.mutate(s => {
      const i = s.products.findIndex(x => x.id === novo.id);
      if (i >= 0) s.products[i] = novo; else s.products.push(novo);
    });
    closeModal();
  };
  const del = $('#prDel');
  if (del) del.onclick = () => {
    Store.mutate(s => {
      const i = s.products.findIndex(x => x.id === id);
      const tomb = { id, active: false, updatedAt: Date.now(), name: p.name, price: p.price, emoji: p.emoji, commission: p.commission };
      if (i >= 0) s.products[i] = tomb; else s.products.push(tomb);
    });
    closeModal();
  };
}

/* ================= ABA COMUNICADOS ================= */
function viewComunicados() {
  const list = Store.activeAnnouncements();
  const blocked = (Store.state.blockedDates || []).filter(b => b.active !== false && b.id >= todayStr()).sort((a, b) => a.id < b.id ? -1 : 1);
  let h = '<div class="card"><h2>📣 Novo comunicado</h2>' +
    '<div class="muted small" style="margin-bottom:8px">Aparece em destaque no app de todos os clientes.</div>' +
    '<div class="row"><div style="width:90px"><label class="fld">Emoji</label><input id="anEmoji" value="📣"></div>' +
    '<div class="grow"><label class="fld">Mostrar até (opcional)</label><input type="date" id="anAte" min="' + todayStr() + '"></div></div>' +
    '<label class="fld">Mensagem</label><textarea id="anTxt" rows="3" placeholder="Ex.: Semana que vem atendo só até 15h."></textarea>' +
    '<button class="btn block" id="anOk" style="margin-top:12px">📲 Publicar aviso</button></div>';

  h += '<div class="card"><h2>✈️ Modo viagem / férias</h2>' +
    '<div class="muted small" style="margin-bottom:8px">Fecha a agenda no período e avisa os clientes automaticamente.</div>' +
    '<div class="row"><div class="grow"><label class="fld">De</label><input type="date" id="viDe" min="' + todayStr() + '"></div>' +
    '<div class="grow"><label class="fld">Até</label><input type="date" id="viAte" min="' + todayStr() + '"></div></div>' +
    '<button class="btn block" id="viOk" style="margin-top:12px">✈️ Ativar modo viagem</button></div>';

  if (list.length) {
    h += '<div class="card"><h2>Avisos ativos</h2>' + list.map(a =>
      '<div class="list-item"><span style="font-size:22px">' + esc(a.emoji || '📣') + '</span>' +
      '<div class="grow">' + esc(a.text) + (a.until ? '<div class="muted small">até ' + dateLabel(a.until) + '</div>' : '') + '</div>' +
      '<button class="btn danger sm" data-rm="' + a.id + '">🗑️</button></div>').join('') + '</div>';
  }
  if (blocked.length) {
    h += '<div class="card"><h2>🚫 Dias fechados</h2>' + blocked.map(b =>
      '<div class="list-item"><div class="grow"><b>' + dateLabel(b.id) + '</b> <span class="muted small">' + esc(b.reason || '') + '</span></div>' +
      '<button class="btn soft sm" data-open="' + b.id + '">Reabrir</button></div>').join('') + '</div>';
  }
  $('#view').innerHTML = h;

  $('#anOk').onclick = () => {
    const t = $('#anTxt').value.trim();
    if (!t) { toast('Escreva a mensagem.', 'danger'); return; }
    Store.mutate(s => s.announcements.push({
      id: uid(), emoji: $('#anEmoji').value.trim() || '📣', text: t,
      until: $('#anAte').value || '', active: true, createdAt: Date.now(), updatedAt: Date.now()
    }));
    toast('📲 Aviso publicado!', 'ok');
  };
  $('#viOk').onclick = () => {
    const de = $('#viDe').value, ate = $('#viAte').value;
    if (!de || !ate || ate < de) { toast('Escolha as duas datas.', 'danger'); return; }
    Store.mutate(s => {
      for (let d = de; d <= ate; d = addDays(d, 1)) {
        const x = s.blockedDates.find(v => v.id === d);
        if (x) { x.active = true; x.reason = 'Viagem'; x.updatedAt = Date.now(); }
        else s.blockedDates.push({ id: d, reason: 'Viagem', active: true, updatedAt: Date.now() });
      }
      s.announcements.push({
        id: uid(), emoji: '✈️',
        text: 'Estarei fora de ' + dateLabel(de) + ' até ' + dateLabel(ate) + '. A agenda volta ao normal depois disso!',
        until: ate, active: true, createdAt: Date.now(), updatedAt: Date.now()
      });
    });
    toast('✈️ Modo viagem ativado — agenda fechada no período.', 'ok');
  };
  $$('#view [data-rm]').forEach(b => b.onclick = () => Store.mutate(s => {
    const a = s.announcements.find(x => x.id === b.dataset.rm);
    if (a) { a.active = false; a.updatedAt = Date.now(); }
  }));
  $$('#view [data-open]').forEach(b => b.onclick = () => Store.mutate(s => {
    const d = s.blockedDates.find(x => x.id === b.dataset.open);
    if (d) { d.active = false; d.updatedAt = Date.now(); }
  }));
}

/* ================= ABA AJUSTES ================= */
function viewAjustes() {
  const c = Store.cfg();
  const dias = [0, 1, 2, 3, 4, 5, 6];
  let h = '<div class="card"><h2>🪪 Perfil</h2>' +
    '<div class="row" style="margin-bottom:6px"><div id="ajAvatar" class="avatar"></div>' +
    '<div class="grow"><label class="fld" style="margin-top:0">Foto de perfil</label><input type="file" id="ajFoto" accept="image/*"></div></div>' +
    '<label class="fld">Nome do estabelecimento</label><input id="ajNome" value="' + esc(c.shopName) + '">' +
    '<label class="fld">Seu nome</label><input id="ajDono" value="' + esc(c.ownerName) + '">' +
    '<label class="fld">Frase de apresentação</label><input id="ajTag" value="' + esc(c.tagline || '') + '">' +
    '<label class="fld">WhatsApp do estabelecimento</label><input id="ajWa" inputmode="tel" value="' + esc(c.whatsapp || '') + '">' +
    '<label class="fld">Endereço</label><input id="ajEnd" value="' + esc(c.address || '') + '">' +
    '<button class="btn block" id="ajSalvar" style="margin-top:12px">💾 Salvar perfil</button></div>';

  h += '<div class="card"><h2>🕐 Horário de funcionamento</h2>' +
    '<label class="fld">Dias abertos</label><div class="opts" id="ajDias">' +
    dias.map(d => '<button class="opt ' + (c.hours.openDays.indexOf(d) !== -1 ? 'sel' : '') + '" data-d="' + d + '">' + WD[d] + '</button>').join('') + '</div>' +
    '<div class="row"><div class="grow"><label class="fld">Abre às</label><input type="time" id="ajIni" value="' + c.hours.start + '"></div>' +
    '<div class="grow"><label class="fld">Fecha às</label><input type="time" id="ajFim" value="' + c.hours.end + '"></div></div>' +
    '<div class="row"><div class="grow"><label class="fld">Duração de cada horário</label><select id="ajSlot">' +
      [15, 20, 30, 40, 45, 60, 90].map(m => '<option value="' + m + '" ' + (c.hours.slotMinutes === m ? 'selected' : '') + '>' + m + ' min</option>').join('') + '</select></div>' +
    '<div class="grow"><label class="fld">Agenda aberta por</label><select id="ajDias2">' +
      [7, 14, 21, 30].map(d => '<option value="' + d + '" ' + ((c.hours.daysAhead || 14) === d ? 'selected' : '') + '>' + d + ' dias</option>').join('') + '</select></div></div>' +
    '<button class="btn block" id="ajSalvarH" style="margin-top:12px">💾 Salvar horários</button></div>';

  h += '<div class="card"><h2>' + (IS_PET ? '🛁 Serviços do petshop' : '✂️ Serviços e preços') + '</h2><div id="ajSvcs">' +
    c.services.map(s => svcRow(s)).join('') + '</div>' +
    '<button class="btn soft block sm" id="ajAddSvc">➕ Adicionar serviço</button>' +
    '<button class="btn block" id="ajSalvarS" style="margin-top:10px">💾 Salvar serviços</button></div>';

  if (IS_PET) {
    h += '<div class="card"><h2>🚗 Leva-e-traz e fidelidade</h2>' +
      '<div class="row"><div class="grow"><label class="fld">Taxa do leva-e-traz (R$)</label><input id="ajTaxa" inputmode="decimal" value="' + (c.pickupFee || 0) + '"></div>' +
      '<div class="grow"><label class="fld">Brinde a cada quantos serviços?</label><input id="ajFiel" inputmode="numeric" value="' + (c.loyaltyEvery || 5) + '"></div></div>' +
      '<button class="btn block" id="ajSalvarX" style="margin-top:12px">💾 Salvar</button></div>';
  } else if (FEAT.loyalty) {
    h += '<div class="card"><h2>🎁 Fidelidade</h2>' +
      '<label class="fld">Brinde a cada quantas visitas?</label><input id="ajFiel" inputmode="numeric" value="' + (c.loyaltyEvery || 5) + '">' +
      '<button class="btn block" id="ajSalvarX" style="margin-top:12px">💾 Salvar</button></div>';
  }

  h += '<div class="card"><h2>🔗 Conexão com o app do cliente</h2>' +
    '<div class="muted small">Código desta loja (os dois apps precisam do mesmo código para se enxergarem):</div>' +
    '<div class="row" style="margin-top:8px"><input readonly value="' + esc(CFG.shopId) + '" id="ajCod"><button class="btn soft sm" id="ajCopy">📋</button></div>' +
    '<div class="muted small" style="margin-top:8px">No mesmo aparelho a sincronização é instantânea. Entre aparelhos diferentes, os dois precisam de internet (o wifi da barbearia serve) — o pareamento é automático pelo código.</div></div>';

  h += '<div class="card"><h2>⚠️ Zona de perigo</h2>' +
    '<button class="btn danger block" id="ajReset">🗑️ Apagar todos os dados desta loja</button></div>';

  $('#view').innerHTML = h;

  const av = $('#ajAvatar');
  if (c.photo) av.innerHTML = '<img src="' + c.photo + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
  else av.textContent = c.icon || '📅';

  let novaFoto = null;
  $('#ajFoto').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    resizePhoto(f, 256, url => {
      novaFoto = url;
      av.innerHTML = '<img src="' + url + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
      toast('Foto pronta — toque em 💾 Salvar perfil.');
    });
  };
  $('#ajSalvar').onclick = () => {
    Store.mutate(s => {
      s.config = Object.assign({}, s.config, {
        shopName: $('#ajNome').value.trim() || c.shopName,
        ownerName: $('#ajDono').value.trim() || c.ownerName,
        tagline: $('#ajTag').value.trim(),
        whatsapp: $('#ajWa').value.trim(),
        address: $('#ajEnd').value.trim(),
        photo: novaFoto || c.photo || '',
        updatedAt: Date.now()
      });
    });
    toast('💾 Perfil salvo — o app dos clientes já foi atualizado!', 'ok');
  };
  $$('#ajDias button').forEach(b => b.onclick = () => b.classList.toggle('sel'));
  $('#ajSalvarH').onclick = () => {
    const open = $$('#ajDias button').filter(b => b.classList.contains('sel')).map(b => +b.dataset.d);
    if (!open.length) { toast('Escolha pelo menos um dia.', 'danger'); return; }
    Store.mutate(s => {
      s.config = Object.assign({}, s.config, {
        hours: { openDays: open, start: $('#ajIni').value || '09:00', end: $('#ajFim').value || '19:00',
                 slotMinutes: +$('#ajSlot').value, daysAhead: +$('#ajDias2').value },
        updatedAt: Date.now()
      });
    });
    toast('💾 Horários salvos!', 'ok');
  };
  $('#ajAddSvc').onclick = () => {
    $('#ajSvcs').insertAdjacentHTML('beforeend', svcRow({ id: uid(), emoji: '✨', name: '', duration: c.hours.slotMinutes }));
    bindSvcRemove();
  };
  bindSvcRemove();
  $('#ajSalvarS').onclick = () => {
    const rows = $$('#ajSvcs .svc-row');
    const list = [];
    rows.forEach(r => {
      const nome = $('.sv-nome', r).value.trim();
      if (!nome) return;
      const s = {
        id: r.dataset.id, name: nome,
        emoji: $('.sv-emoji', r).value.trim() || '✨',
        duration: +$('.sv-dur', r).value || c.hours.slotMinutes
      };
      if (IS_PET) {
        s.priceBySize = {
          P: parseFloat(String($('.sv-p', r).value).replace(',', '.')) || 0,
          M: parseFloat(String($('.sv-m', r).value).replace(',', '.')) || 0,
          G: parseFloat(String($('.sv-g', r).value).replace(',', '.')) || 0
        };
      } else {
        s.price = parseFloat(String($('.sv-preco', r).value).replace(',', '.')) || 0;
      }
      list.push(s);
    });
    if (!list.length) { toast('Cadastre pelo menos um serviço.', 'danger'); return; }
    Store.mutate(st => { st.config = Object.assign({}, st.config, { services: list, updatedAt: Date.now() }); });
    toast('💾 Serviços salvos!', 'ok');
  };
  const sx = $('#ajSalvarX');
  if (sx) sx.onclick = () => {
    Store.mutate(s => {
      s.config = Object.assign({}, s.config, {
        pickupFee: $('#ajTaxa') ? (parseFloat(String($('#ajTaxa').value).replace(',', '.')) || 0) : c.pickupFee,
        loyaltyEvery: Math.max(2, +$('#ajFiel').value || 5),
        updatedAt: Date.now()
      });
    });
    toast('💾 Salvo!', 'ok');
  };
  $('#ajCopy').onclick = () => navigator.clipboard.writeText(CFG.shopId).then(() => toast('📋 Código copiado.'));
  $('#ajReset').onclick = () => {
    if (!confirm('Apagar TODOS os agendamentos, avisos e ajustes desta loja? Não dá para desfazer.')) return;
    if (!confirm('Tem certeza mesmo?')) return;
    Store.state = Store.blank();
    Store.state.config.updatedAt = Date.now();
    Store.save();
    Sync.broadcastLocal();
    Sync.schedulePublish();
    render();
    toast('🗑️ Dados apagados.');
  };
}
function svcRow(s) {
  const precos = IS_PET
    ? '<div class="row" style="margin-top:6px">' +
      '<input class="sv-p" inputmode="decimal" placeholder="P R$" value="' + (s.priceBySize ? s.priceBySize.P : '') + '">' +
      '<input class="sv-m" inputmode="decimal" placeholder="M R$" value="' + (s.priceBySize ? s.priceBySize.M : '') + '">' +
      '<input class="sv-g" inputmode="decimal" placeholder="G R$" value="' + (s.priceBySize ? s.priceBySize.G : '') + '"></div>'
    : '';
  return '<div class="svc-row" data-id="' + esc(s.id) + '" style="border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px">' +
    '<div class="row"><input class="sv-emoji" style="width:64px" value="' + esc(s.emoji || '') + '">' +
    '<input class="sv-nome grow" placeholder="Nome do serviço" value="' + esc(s.name || '') + '">' +
    '<button class="btn danger sm sv-del">🗑️</button></div>' +
    '<div class="row" style="margin-top:6px">' +
    (IS_PET ? '' : '<input class="sv-preco" inputmode="decimal" placeholder="Preço R$" value="' + (s.price != null ? s.price : '') + '">') +
    '<select class="sv-dur">' + [15, 20, 30, 40, 45, 60, 90, 120].map(m =>
      '<option value="' + m + '" ' + ((s.duration || 30) === m ? 'selected' : '') + '>' + m + ' min</option>').join('') + '</select></div>' +
    precos + '</div>';
}
function bindSvcRemove() {
  $$('#ajSvcs .sv-del').forEach(b => b.onclick = () => b.closest('.svc-row').remove());
}
function resizePhoto(file, size, cb) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const x = cv.getContext('2d');
    const s = Math.max(size / img.width, size / img.height);
    x.drawImage(img, (size - img.width * s) / 2, (size - img.height * s) / 2, img.width * s, img.height * s);
    cb(cv.toDataURL('image/jpeg', .82));
  };
  img.src = URL.createObjectURL(file);
}

/* ================= navegação ================= */
function tabsDef() {
  const t = [{ id: 'agenda', ic: '📅', lb: 'Agenda' }];
  t.push({ id: 'clientes', ic: IS_PET ? '🐾' : '👥', lb: IS_PET ? 'Tutores' : 'Clientes' });
  if (FEAT.products) t.push({ id: 'produtos', ic: '🛍️', lb: 'Produtos' });
  t.push({ id: 'avisos', ic: '📣', lb: 'Avisos' });
  t.push({ id: 'ajustes', ic: '⚙️', lb: 'Ajustes' });
  return t;
}
function renderTabs() {
  const due = remindersDue().length + Store.activeBookings().filter(b => b.status === 'pendente' && b.date >= todayStr()).length;
  $('#tabs').innerHTML = tabsDef().map(t =>
    '<button class="tab ' + (tab === t.id ? 'sel' : '') + '" data-tab="' + t.id + '">' +
    (t.id === 'clientes' && remindersDue().length ? '<span class="badge">' + remindersDue().length + '</span>' : '') +
    (t.id === 'agenda' && due ? '' : '') +
    '<span class="ic">' + t.ic + '</span><span class="lb">' + t.lb + '</span></button>').join('');
  $$('#tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
}
function renderHeader() {
  const c = Store.cfg();
  $('#shopName').textContent = c.shopName;
  $('#roleChip').textContent = (CFG.icon || '') + ' ' + (CFG.ownerTitle || 'Painel');
  const av = $('#avatar');
  if (c.photo) av.innerHTML = '<img src="' + c.photo + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
  else av.textContent = c.icon || '📅';
}
function render() {
  renderHeader();
  renderTabs();
  if (tab === 'agenda') viewAgenda();
  else if (tab === 'clientes') viewClientes();
  else if (tab === 'produtos') viewProdutos();
  else if (tab === 'avisos') viewComunicados();
  else viewAjustes();
}

document.addEventListener('tick', () => { if (tab === 'agenda') viewAgenda(); });

Sync.onStatus(s => {
  const dot = $('#syncDot'), lb = $('#syncLabel');
  if (s === 'online') { dot.className = 'sync-dot online'; lb.textContent = 'tempo real conectado'; }
  else if (s === 'conectando') { dot.className = 'sync-dot'; lb.textContent = 'conectando…'; }
  else { dot.className = 'sync-dot local'; lb.textContent = 'modo local (sem internet)'; }
});

render();
Sync.init();
setTimeout(autoReminders, 1200);
</script>
