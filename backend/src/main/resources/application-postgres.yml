# Perfil de produção — PostgreSQL real.
# Ative com: --spring.profiles.active=postgres  (e as variáveis abaixo)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kairos}
    username: ${DB_USER:kairos}
    password: ${DB_PASSWORD:kairos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
