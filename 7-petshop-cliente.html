<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#14110D; --bg2:#1A1610; --card:#1F1A14; --border:#3A3128;
  --text:#F5EFE6; --dim:#A89F91; --primary:#D9A441; --primaryDark:#B8862F;
  --onPrimary:#1C1508; --accent:#F0C066; --chip:#2B2318;
  --ok:#59B87F; --okBg:#1B2E23; --warn:#E0A831; --warnBg:#332A17;
  --danger:#E06056; --dangerBg:#33201D;
}
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea {

  padding: 11px 13px;
  width: 100%;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
input[type="checkbox"] { width: auto; accent-color: var(--primary); }
label.fld { display: block; font-size: 13px; color: var(--dim); font-weight: 600; margin: 12px 0 5px; }
a { color: var(--accent); }

.wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 110px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}
.card h2 { font-size: 17px; margin-bottom: 10px; }
.muted { color: var(--dim); font-size: 13px; }
.small { font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; }
.right { margin-left: auto; }
.center { text-align: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: var(--onPrimary);
  border-radius: 14px; padding: 13px 18px;
  font-weight: 700; font-size: 15px;
  transition: transform .06s ease, filter .15s;
  text-decoration: none;
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.big { padding: 16px 20px; font-size: 17px; border-radius: 16px; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn.soft { background: var(--chip); color: var(--text); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { background: var(--dangerBg); color: var(--danger); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chip {

/* opções em pílulas (tamanho do pet etc.) */

/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px 22px 0 0; width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto; padding: 20px 18px 26px;

@keyframes up { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
.modal h3 { font-size: 18px; margin-bottom: 12px; }
@media (min-width: 560px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: 22px; }
}

/* toasts */
#toasts { position: fixed; top: 12px; left: 0; right: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {

  border-radius: 14px; padding: 11px 16px; font-size: 14px; font-weight: 600;

}

.toast.ok { border-color: var(--ok); }

/* abas fixas no rodapé (painel) */
.tabs {

}
.tab { flex: 1; text-align: center; padding: 6px 2px; border-radius: 12px; position: relative; color: var(--dim); }

.tab.sel { color: var(--text); background: var(--chip); }

/* linhas da agenda do painel */
.ag-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
.ag-time { flex: none; width: 52px; text-align: right; font-weight: 800; font-size: 13.5px; color: var(--dim); padding-top: 12px; }
.ag-body { flex: 1; min-width: 0; }
.ag-free {

}
.ag-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px; padding: 11px 12px; }

.hero {

<script>
/* ============================================================
   MOTOR COMPARTILHADO — utilidades, dados e sincronização
   Sincroniza em tempo real:
   1. mesma aba/navegador  -> BroadcastChannel + localStorage (funciona offline)
   2. outros aparelhos     -> broker MQTT público via internet (wifi com internet)
   ============================================================ */

const CFG = JSON.parse(document.getElementById('app-config').textContent);
(function () {
  const q = new URLSearchParams(location.search).get('loja');
  if (q) CFG.shopId = q.trim();
})();

/* ---------- utilidades ---------- */
const $  = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function digits(s) { return String(s || '').replace(/\D+/g, ''); }
function phoneBR(s) {
  let d = digits(s);
  if (!d) return '';
  if (d.startsWith('0')) d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function fmtPhone(s) {
  const d = digits(s).replace(/^55/, '');
  if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return s || '';
}
function money(v) {
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
const WD  = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WDF = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function todayStr() { return dateToStr(new Date()); }
function dateToStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function strToDate(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = strToDate(s); d.setDate(d.getDate() + n); return dateToStr(d); }
function dateLabel(s) { const d = strToDate(s); return WD[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function dateLabelLong(s) { const d = strToDate(s); return WDF[d.getDay()] + ', dia ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function timeToMin(t) { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function minToTime(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function bookingMoment(b) { const d = strToDate(b.date); d.setMinutes(timeToMin(b.time)); return d.getTime(); }
function humanETA(ms) {
  const min = Math.round(ms / 60000);
  if (min <= 0) return 'agora';
  if (min < 60) return 'em ' + min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return 'em ' + h + 'h' + (m ? String(m).padStart(2, '0') : '');
  const dias = Math.round(h / 24);
  return 'em ' + dias + (dias === 1 ? ' dia' : ' dias');
}
function deviceId() {
  let id = localStorage.getItem('agendapp-device');
  if (!id) { id = uid(); localStorage.setItem('agendapp-device', id); }
  return id;
}
const DEVICE = deviceId();

function waLink(phone, text) {
  const p = phoneBR(phone);
  const t = encodeURIComponent(text || '');
  return p ? 'https://wa.me/' + p + '?text=' + t : 'https://wa.me/?text=' + t;
}
function openWa(phone, text) { window.open(waLink(phone, text), '_blank'); }

/* ---------- toasts + som ---------- */
function toast(msg, kind) {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = msg;
  box.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 4200);
}
function ding() {
  try {
    const ctx = ding.ctx || (ding.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [[880, 0], [1174, .18]].forEach(([f, dt]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(.0001, ctx.currentTime + dt);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + dt + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + dt + .35);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + dt); o.stop(ctx.currentTime + dt + .4);
    });
    if (navigator.vibrate) navigator.vibrate(180);
  } catch (e) {}
}

/* ---------- estado (dados da loja) ---------- */
const Store = {
  key: 'agendapp:' + CFG.shopId,
  state: null,
  listeners: [],

  blank() { return { v: 1, config: { updatedAt: 0 }, bookings: [], announcements: [], blockedDates: [], products: [], sales: [] }; },

  load() {
    try { this.state = Object.assign(this.blank(), JSON.parse(localStorage.getItem(this.key) || '{}')); }
    catch (e) { this.state = this.blank(); }
    ['bookings', 'announcements', 'blockedDates', 'products', 'sales'].forEach(k => { if (!Array.isArray(this.state[k])) this.state[k] = []; });
    if (!this.state.config) this.state.config = { updatedAt: 0 };
    return this.state;
  },

  raw() { return localStorage.getItem(this.key) || ''; },

  save() {
    const corte = addDays(todayStr(), -60);
    this.state.bookings = this.state.bookings.filter(b => b.date >= corte);
    localStorage.setItem(this.key, JSON.stringify(this.state));
  },

  /* mescla dois estados: vence quem tem updatedAt maior, registro a registro */
  mergeStates(a, b) {
    const out = this.blank();
    out.config = ((b.config && b.config.updatedAt) || 0) > ((a.config && a.config.updatedAt) || 0) ? b.config : (a.config || { updatedAt: 0 });
    ['bookings', 'announcements', 'blockedDates', 'products', 'sales'].forEach(k => {
      const map = {};
      (a[k] || []).concat(b[k] || []).forEach(r => {
        if (!r || !r.id) return;
        const cur = map[r.id];
        if (!cur || (r.updatedAt || r.createdAt || 0) >= (cur.updatedAt || cur.createdAt || 0)) map[r.id] = r;
      });
      out[k] = Object.values(map).sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
    });
    return out;
  },

  /* aplica um estado vindo de fora (outra aba / outro aparelho) */
  applyRemote(remote) {
    if (!remote || typeof remote !== 'object') return;
    const merged = this.mergeStates(this.state, remote);
    const mergedStr = JSON.stringify(merged);
    const changedLocal = mergedStr !== JSON.stringify(this.state);
    const remoteMissing = mergedStr !== JSON.stringify(this.mergeStates(remote, remote));
    if (changedLocal) {
      const before = this.state;
      this.state = merged;
      this.save();
      this.listeners.forEach(fn => fn(before));
    }
    if (remoteMissing) Sync.schedulePublish();
  },

  /* mutação local: altera, salva, notifica e publica */
  mutate(fn) {
    fn(this.state);
    this.save();
    this.listeners.forEach(l => l(null));
    Sync.broadcastLocal();
    Sync.schedulePublish();
  },

  onChange(fn) { this.listeners.push(fn); },

  /* configuração efetiva = padrão do arquivo + ajustes feitos no painel */
  cfg() {
    const o = this.state.config || {};
    const c = Object.assign({}, CFG, o);
    c.hours = Object.assign({}, CFG.hours, o.hours || {});
    c.services = (o.services && o.services.length) ? o.services : CFG.services;
    return c;
  },

  products() {
    const map = {};
    (CFG.products || []).forEach(p => map[p.id] = Object.assign({}, p));
    (this.state.products || []).forEach(p => map[p.id] = p);
    return Object.values(map).filter(p => p.active !== false);
  },

  activeAnnouncements() {
    const hoje = todayStr();
    return (this.state.announcements || [])
      .filter(a => a.active !== false && (!a.until || a.until >= hoje))
      .sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
  },

  activeBookings() { return this.state.bookings.filter(b => b.status !== 'cancelado' && b.type !== 'hotel'); },
  hotelRequests()  { return this.state.bookings.filter(b => b.type === 'hotel'); }
};

/* ---------- horários ---------- */
const Slots = {
  isOpen(dateStr) {
    const c = Store.cfg();
    if ((Store.state.blockedDates || []).some(b => b.id === dateStr && b.active !== false)) return false;
    return c.hours.openDays.indexOf(strToDate(dateStr).getDay()) !== -1;
  },
  blockedReason(dateStr) {
    const b = (Store.state.blockedDates || []).find(x => x.id === dateStr && x.active !== false);
    return b ? (b.reason || 'Fechado') : null;
  },
  /* lista de horários do dia com situação de cada um */
  grid(dateStr) {
    const c = Store.cfg();
    const list = [];
    const start = timeToMin(c.hours.start), end = timeToMin(c.hours.end), step = c.hours.slotMinutes || 30;
    for (let m = start; m + step <= end; m += step) list.push({ time: minToTime(m), min: m });
    const dayBookings = Store.activeBookings().filter(b => b.date === dateStr);
    const now = new Date();
    const isToday = dateStr === todayStr();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    list.forEach(s => {
      s.past = isToday && s.min <= nowMin;
      s.booking = dayBookings.find(b => {
        const bs = timeToMin(b.time), be = bs + (b.duration || step);
        return s.min >= bs && s.min < be;
      }) || null;
      s.startsBooking = !!(s.booking && timeToMin(s.booking.time) === s.min);
    });
    return list;
  },
  /* horários livres onde cabe um serviço de `dur` minutos */
  freeFor(dateStr, dur) {
    if (!this.isOpen(dateStr)) return [];
    const c = Store.cfg();
    const step = c.hours.slotMinutes || 30;
    const need = Math.max(1, Math.ceil((dur || step) / step));
    const g = this.grid(dateStr);
    const out = [];
    for (let i = 0; i < g.length; i++) {
      if (g[i].past || g[i].booking) continue;
      let ok = true;
      for (let j = 1; j < need; j++) {
        if (!g[i + j] || g[i + j].booking) { ok = false; break; }
      }
      const endMin = g[i].min + (dur || step);
      if (endMin > timeToMin(c.hours.end)) ok = false;
      if (ok) out.push(g[i].time);
    }
    return out;
  },
  isFree(dateStr, time, dur) { return this.freeFor(dateStr, dur).indexOf(time) !== -1; }
};

/* ---------- sincronização em tempo real ---------- */
const Sync = {
  status: 'local',           // local | conectando | online
  statusListeners: [],
  mqttClient: null,
  channel: null,
  lastRaw: '',
  publishTimer: null,
  topic: 'agendapp/v2/' + CFG.shopId,

  onStatus(fn) { this.statusListeners.push(fn); fn(this.status); },
  setStatus(s) { this.status = s; this.statusListeners.forEach(fn => fn(s)); },

  init() {
    this.lastRaw = Store.raw();
    /* mesma máquina: BroadcastChannel */
    try {
      this.channel = new BroadcastChannel('agendapp-' + CFG.shopId);
      this.channel.onmessage = ev => { if (ev.data && ev.data.state) Store.applyRemote(ev.data.state); };
    } catch (e) {}
    /* mesma máquina: evento de storage + vigia (funciona até em file://) */
    window.addEventListener('storage', ev => { if (ev.key === Store.key) this.pollLocal(); });
    setInterval(() => this.pollLocal(), 2500);
    /* outros aparelhos: MQTT via internet */
    this.connectMqtt();
  },

  pollLocal() {
    const raw = Store.raw();
    if (raw === this.lastRaw) return;
    this.lastRaw = raw;
    try { Store.applyRemote(JSON.parse(raw)); } catch (e) {}
  },

  broadcastLocal() {
    this.lastRaw = Store.raw();
    try { this.channel && this.channel.postMessage({ state: Store.state }); } catch (e) {}
  },

  loadMqttLib(cb) {
    if (window.mqtt) return cb(true);
    const urls = [
      'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
      'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'
    ];
    (function next(i) {
      if (i >= urls.length) return cb(false);
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = () => cb(!!window.mqtt);
      s.onerror = () => next(i + 1);
      document.head.appendChild(s);
    })(0);
  },

  connectMqtt() {
    const self = this;
    this.setStatus('conectando');
    this.loadMqttLib(ok => {
      if (!ok) { self.setStatus('local'); setTimeout(() => self.connectMqtt(), 60000); return; }
      const brokers = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081'];
      let idx = 0, connected = false;

      function tryBroker() {
        if (idx >= brokers.length) { self.setStatus('local'); setTimeout(() => { idx = 0; tryBroker(); }, 45000); return; }
        const url = brokers[idx];
        let settled = false;
        const c = window.mqtt.connect(url, {
          clientId: 'agp_' + DEVICE + '_' + Math.random().toString(16).slice(2, 6),
          clean: true, connectTimeout: 9000, reconnectPeriod: 6000, keepalive: 45
        });
        self.mqttClient = c;
        const giveUp = setTimeout(() => {
          if (!connected && !settled) { settled = true; try { c.end(true); } catch (e) {} idx++; tryBroker(); }
        }, 11000);
        c.on('connect', () => {
          connected = true; settled = true; clearTimeout(giveUp);
          self.setStatus('online');
          c.subscribe(self.topic, { qos: 0 });
          self.schedulePublish();
        });
        c.on('message', (t, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (msg && msg.state) Store.applyRemote(msg.state);
          } catch (e) {}
        });
        c.on('close', () => { if (connected) self.setStatus('conectando'); });
        c.on('error', () => {
          if (!connected && !settled) { settled = true; clearTimeout(giveUp); try { c.end(true); } catch (e) {} idx++; tryBroker(); }
        });
      }
      tryBroker();
    });
  },

  schedulePublish() {
    clearTimeout(this.publishTimer);
    this.publishTimer = setTimeout(() => this.publishNow(), 450);
  },

  publishNow() {
    this.lastRaw = Store.raw();
    if (!this.mqttClient || this.status !== 'online') return;
    try {
      this.mqttClient.publish(this.topic, JSON.stringify({ origin: DEVICE, at: Date.now(), state: Store.state }), { retain: true, qos: 0 });
    } catch (e) {}
  }
};

/* -------- passo a passo do agendamento -------- */
const wiz = { open: false, step: 1, serviceId: null, date: null, time: null };

function openWizard() {
  wiz.open = true; wiz.step = 1; wiz.serviceId = null; wiz.date = null; wiz.time = null;
  $('#wizard').style.display = '';
  $('#ctaBox').style.display = 'none';
  renderWizard();
  $('#wizard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function closeWizard() {
  wiz.open = false;
  $('#wizard').style.display = 'none';
  $('#ctaBox').style.display = '';
}
function stepsBar() {
  const total = 4;
  $('#stepsBar').innerHTML = Array.from({ length: total }, (_, i) =>
    '<i class="' + (i < wiz.step ? 'on' : '') + '"></i>').join('');
}
function backBtn(step) {
  return '<button class="btn ghost sm" id="wBack" style="margin-top:12px">← Voltar</button>';
}
function renderWizard() {
  if (!wiz.open) return;
  stepsBar();
  const c = Store.cfg();
  const body = $('#wizBody');

  /* PASSO 1 — serviço */
  if (wiz.step === 1) {
    body.innerHTML = '<h2>1. Qual serviço?</h2>' +
      c.services.map(s =>
        '<button class="svc" data-svc="' + esc(s.id) + '">' +
        '<span class="emoji">' + esc(s.emoji || '✨') + '</span>' +
        '<span><span class="nm">' + esc(s.name) + '</span><br><span class="inf">' + (s.duration || c.hours.slotMinutes) + ' min</span></span>' +
        '<span class="pr">' + svcPriceLabel(s) + '</span></button>'
      ).join('') +
      '<button class="btn ghost sm" id="wCancel" style="margin-top:6px">✕ Fechar</button>';
    $$('#wizBody [data-svc]').forEach(b => b.onclick = () => { wiz.serviceId = b.dataset.svc; wiz.step = 2; renderWizard(); });
    $('#wCancel').onclick = closeWizard;
    return;
  }

  const svc = c.services.find(s => s.id === wiz.serviceId) || c.services[0];

  /* PASSO 2 — dia */
  if (wiz.step === 2) {
    let days = '';
    for (let i = 0; i < (c.hours.daysAhead || 14); i++) {
      const ds = addDays(todayStr(), i);
      const d = strToDate(ds);
      const open = Slots.isOpen(ds) && Slots.freeFor(ds, svc.duration).length > 0;
      days += '<button class="day ' + (wiz.date === ds ? 'sel' : '') + (open ? '' : ' off') + '" data-day="' + ds + '" ' + (open ? '' : 'disabled') + '>' +
        '<span class="wd">' + WD[d.getDay()] + '</span><span class="dn">' + d.getDate() + '</span></button>';
    }
    body.innerHTML = '<h2>2. Qual dia?</h2>' +
      '<div class="muted small" style="margin-bottom:8px">' + esc(svc.emoji || '') + ' ' + esc(svc.name) + '</div>' +
      '<div class="days">' + days + '</div>' +
      '<div id="dayNote" class="muted small"></div>' + backBtn();
    $$('#wizBody [data-day]').forEach(b => b.onclick = () => { wiz.date = b.dataset.day; wiz.step = 3; renderWizard(); });
    $('#wBack').onclick = () => { wiz.step = 1; renderWizard(); };
    return;
  }

  /* PASSO 3 — horário */
  if (wiz.step === 3) {
    const free = Slots.freeFor(wiz.date, svc.duration);
    body.innerHTML = '<h2>3. Qual horário?</h2>' +
      '<div class="muted small" style="margin-bottom:10px">' + dateLabelLong(wiz.date) + ' · os horários riscados já foram reservados</div>' +
      '<div class="slots">' + Slots.grid(wiz.date).filter(s => !s.past).map(s => {
        const ok = free.indexOf(s.time) !== -1;
        return '<button class="slot ' + (wiz.time === s.time ? 'sel' : '') + (ok ? '' : ' busy') + '" data-time="' + s.time + '">' + s.time + '</button>';
      }).join('') + '</div>' +
      (free.length ? '' : '<div class="banner" style="margin-top:12px"><span class="emoji">😕</span><div>Nenhum horário livre neste dia. Tente outro dia.</div></div>') +
      backBtn();
    $$('#wizBody [data-time]').forEach(b => b.onclick = () => { wiz.time = b.dataset.time; wiz.step = 4; renderWizard(); });
    $('#wBack').onclick = () => { wiz.step = 2; renderWizard(); };
    return;
  }

  /* PASSO 4 — dados + confirmação */
  if (wiz.step === 4) {
    const petFields = !IS_PET ? '' :
      '<label class="fld">Nome do pet</label><input id="fPet" placeholder="Ex.: Thor" value="' + esc(me.pet.name) + '">' +
      '<label class="fld">Ele é…</label><div class="opts" id="fSpecies">' +
        '<button class="opt" data-v="cão">🐶 Cão</button><button class="opt" data-v="gato">🐱 Gato</button></div>' +
      '<label class="fld">Porte</label><div class="opts" id="fSize">' +
        '<button class="opt" data-v="P">P — pequeno</button><button class="opt" data-v="M">M — médio</button><button class="opt" data-v="G">G — grande</button></div>' +
      '<label class="fld">Busca e entrega (leva-e-traz)?</label><div class="opts" id="fPickup">' +
        '<button class="opt" data-v="nao">Eu levo</button><button class="opt" data-v="sim">🚗 Buscar em casa (+' + money(Store.cfg().pickupFee || 0) + ')</button></div>' +
      '<div id="fAddrBox" style="display:none"><label class="fld">Endereço para buscar</label><input id="fAddr" placeholder="Rua, número e bairro"></div>' +
      '<label class="fld">Capricho final</label><div class="opts" id="fPerfume">' +
        '<button class="opt sel" data-v="sim">🌸 Com perfume e laço</button><button class="opt" data-v="nao">Sem perfume</button></div>' +
      '<label class="fld">Observações (alergias, medos…)</label><input id="fNotes" placeholder="Opcional">';

    body.innerHTML = '<h2>4. Seus dados</h2>' +
      '<label class="fld">Seu nome</label><input id="fName" placeholder="Como podemos te chamar?" value="' + esc(me.name) + '">' +
      '<label class="fld">Seu WhatsApp</label><input id="fPhone" inputmode="tel" placeholder="(11) 99999-0000" value="' + esc(me.phone) + '">' +
      petFields +

        '<b>' + esc(svc.emoji || '') + ' ' + esc(svc.name) + '</b>' +
        '<div class="muted small">' + dateLabelLong(wiz.date) + ' às ' + wiz.time + '</div>' +
        '<div style="margin-top:6px;font-size:18px;font-weight:900;color:var(--accent)" id="fTotal"></div>' +
      '</div>' +
      '<button class="btn big block" id="wConfirm" style="margin-top:8px">✅ Confirmar agendamento</button>' +
      backBtn();

    }

      bindOpts('#fSpecies', 'species');
      bindOpts('#fSize', 'size');
      bindOpts('#fPickup', 'pickup', () => { $('#fAddrBox').style.display = petSel.pickup === 'sim' ? '' : 'none'; });
      bindOpts('#fPerfume', 'perfume');
    }
    updTotal();
    $('#wBack').onclick = () => { wiz.step = 3; renderWizard(); };

    $('#wConfirm').onclick = () => {
      const name = $('#fName').value.trim();
      const phone = $('#fPhone').value.trim();
      if (!name) { toast('Escreva seu nome 🙂', 'danger'); return; }
      if (digits(phone).length < 10) { toast('Confira o número do WhatsApp (com DDD).', 'danger'); return; }
      if (IS_PET && !$('#fPet').value.trim()) { toast('Qual o nome do pet?', 'danger'); return; }
      if (!Slots.isFree(wiz.date, wiz.time, svc.duration)) {
        toast('😕 Esse horário acabou de ser reservado. Escolha outro.', 'danger');
        wiz.step = 3; wiz.time = null; renderWizard(); return;
      }
      me.name = name; me.phone = phone;
      let price = svcPrice(svc, petSel.size);
      let pet = null;
      if (IS_PET) {
        pet = {
          name: $('#fPet').value.trim(), species: petSel.species, size: petSel.size,
          pickup: petSel.pickup === 'sim', address: petSel.pickup === 'sim' ? $('#fAddr').value.trim() : '',
          perfume: petSel.perfume === 'sim', notes: $('#fNotes').value.trim()
        };
        me.pet = { name: pet.name, species: pet.species, size: pet.size };
        if (pet.pickup) price += (Store.cfg().pickupFee || 0);
      }
      saveMe();
      const booking = {
        id: uid(), type: 'servico', name, phone,
        serviceId: svc.id, serviceName: svc.name, emoji: svc.emoji || '',
        price, duration: svc.duration || Store.cfg().hours.slotMinutes,
        date: wiz.date, time: wiz.time,
        status: 'pendente', pet,
        deviceId: DEVICE, source: 'cliente',
        createdAt: Date.now(), updatedAt: Date.now()
      };
      Store.mutate(s => s.bookings.push(booking));
      closeWizard();
      renderMyBookings();
      toast('🎉 Agendado! ' + dateLabel(wiz.date) + ' às ' + wiz.time + '. Aguarde a confirmação.', 'ok');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    return;
  }
}

/* -------- hospedagem / hotelzinho (petshop) -------- */
function renderHotel() {
  if (!(CFG.features && CFG.features.hotel)) return;
  if ($('#hotelBox').dataset.done) return;
  $('#hotelBox').dataset.done = '1';
  const c = Store.cfg();
  $('#hotelBox').innerHTML =
    '<div class="card"><h2>🏨 Hotelzinho para seu pet</h2>' +
    '<div class="muted" style="margin-bottom:10px">Vai viajar? Deixe seu pet hospedado com a gente. Peça uma cotação:</div>' +
    '<div class="row"><div class="grow"><label class="fld">Entrada</label><input type="date" id="hIn" min="' + todayStr() + '"></div>' +
    '<div class="grow"><label class="fld">Saída</label><input type="date" id="hOut" min="' + todayStr() + '"></div></div>' +
    '<label class="fld">Observações</label><input id="hNotes" placeholder="Ração própria, remédios, manias…">' +
    '<button class="btn block" id="hAsk" style="margin-top:12px">🐾 Pedir cotação de hospedagem</button>' +
    '<button class="btn ghost block sm" style="margin-top:8px" onclick="window.open(\'https://www.google.com/maps/search/hotel+para+cachorro+perto+de+mim\',\'_blank\')">🔍 Procurar outros hotéis pet perto de mim</button>' +
    '</div>';
  $('#hAsk').onclick = () => {
    const ci = $('#hIn').value, co = $('#hOut').value;
    if (!ci || !co || co <= ci) { toast('Escolha as datas de entrada e saída.', 'danger'); return; }
    if (!me.name || digits(me.phone).length < 10) {
      const nome = prompt('Seu nome:', me.name || ''); if (!nome) return;
      const fone = prompt('Seu WhatsApp (com DDD):', me.phone || ''); if (!fone || digits(fone).length < 10) return;
      me.name = nome.trim(); me.phone = fone.trim(); saveMe();
    }
    const req = {
      id: uid(), type: 'hotel', name: me.name, phone: me.phone,
      serviceName: 'Hospedagem', emoji: '🏨', price: 0, duration: 0,
      date: ci, time: '12:00', status: 'pendente',
      pet: { name: me.pet.name || '', species: me.pet.species || 'cão', size: me.pet.size || 'M' },
      hotel: { checkin: ci, checkout: co, notes: $('#hNotes').value.trim() },
      deviceId: DEVICE, source: 'cliente', createdAt: Date.now(), updatedAt: Date.now()
    };
    Store.mutate(s => s.bookings.push(req));
    toast('🏨 Pedido enviado! O petshop responde com o valor.', 'ok');
    renderMyBookings();
  };
}

/* -------- vitrine de produtos -------- */
function renderProducts() {
  if (!(CFG.features && CFG.features.products)) return;
  const list = Store.products();
  if (!list.length) { $('#productsBox').innerHTML = ''; return; }
  const c = Store.cfg();
  $('#productsBox').innerHTML =
    '<div class="card"><h2>🛍️ Produtos que temos na loja</h2>' +
    list.map(p =>
      '<div class="list-item"><span style="font-size:24px">' + esc(p.emoji || '🛍️') + '</span>' +
      '<div class="grow"><b>' + esc(p.name) + '</b><div class="muted small">' + money(p.price) + '</div></div>' +
      '<button class="btn sm" data-buy="' + esc(p.id) + '">Quero!</button></div>'
    ).join('') + '</div>';
  $$('#productsBox [data-buy]').forEach(b => b.onclick = () => {
    const p = Store.products().find(x => x.id === b.dataset.buy);
    openWa(c.whatsapp, 'Olá! Vi no app da ' + c.shopName + ' e tenho interesse no produto: ' + p.emoji + ' ' + p.name + ' (' + money(p.price) + ')');
  });
}

/* -------- reação a mudanças vindas do painel/outros aparelhos -------- */
let lastStatuses = {};
function snapshotStatuses() {
  lastStatuses = {};
  myList().forEach(b => lastStatuses[b.id] = b.status);
}
Store.onChange(() => {
  myList().forEach(b => {
    const old = lastStatuses[b.id];
    if (old && old !== b.status) {
      if (b.status === 'confirmado') { toast('✅ Seu horário foi confirmado!', 'ok'); ding(); }
      if (b.status === 'cancelado')  { toast('❌ Um agendamento foi cancelado pelo estabelecimento.', 'danger'); }
    }
    if (b.type === 'hotel' && old === 'pendente' && b.status === 'confirmado') { toast('🏨 Hospedagem confirmada!', 'ok'); ding(); }
  });
  snapshotStatuses();
  renderAll(true);
});

function renderAll(keepWizard) {
  renderHeader();
  renderAnnouncements();
  renderMyBookings();
  renderProducts();
  renderHotel();
  /* no passo 4 o cliente está digitando — não recarrega o formulário */
  if (wiz.open && keepWizard && wiz.step !== 4) renderWizard();
}

document.addEventListener('tick', () => { renderMyBookings(); });
$('#ctaBtn').onclick = openWizard;

Sync.onStatus(s => {
  const dot = $('#syncDot'), lb = $('#syncLabel');
  if (s === 'online') { dot.className = 'sync-dot online'; lb.textContent = 'tempo real conectado'; }
  else if (s === 'conectando') { dot.className = 'sync-dot'; lb.textContent = 'conectando…'; }
  else { dot.className = 'sync-dot local'; lb.textContent = 'modo local (sem internet)'; }
});

snapshotStatuses();
renderAll();
Sync.init();
</script>
