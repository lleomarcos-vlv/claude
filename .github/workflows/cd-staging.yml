name: CD (staging)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cd-staging.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cd-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # for cloud OIDC (e.g. aws-actions/configure-aws-credentials)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }} # ghcr.io/<owner>/<repo>
  NODE_VERSION: "22"

jobs:
  # ── Build & push the API and Web Admin images ──────────────────────────────
  build-images:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: infra/docker/api.Dockerfile
            image: jardimja-api
          - app: web-admin
            dockerfile: infra/docker/web-admin.Dockerfile
            image: jardimja-web-admin
    outputs:
      api_image: ${{ steps.meta-out.outputs.api_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Expose API image tag
        id: meta-out
        if: matrix.app == 'api'
        run: echo "api_image=${{ env.IMAGE_PREFIX }}/jardimja-api:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── Database migrations (prisma migrate deploy) ────────────────────────────
  migrate:
    name: DB migrate deploy
    needs: build-images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy
        # DATABASE_URL is a protected Environment secret; migrations run against
        # the target DB (reachable via a runner with network access / bastion).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @jardimja/api prisma:migrate

  # ── Deploy (placeholder: ECS force new deployment OR kubectl rollout) ──────
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'staging' }}
    needs: [build-images, migrate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: https://api.jardimja.com.br
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Option A: ECS Fargate ───────────────────────────────────────────────
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      # - name: Force new ECS deployment (pulls the freshly pushed image tag)
      #   run: |
      #     aws ecs update-service \
      #       --cluster jardimja-staging-cluster \
      #       --service jardimja-staging-api \
      #       --force-new-deployment
      #     aws ecs wait services-stable \
      #       --cluster jardimja-staging-cluster \
      #       --services jardimja-staging-api

      # ── Option B: Kubernetes ────────────────────────────────────────────────
      # - name: Set up kubectl
      #   uses: azure/setup-kubectl@v4
      # - name: Rollout
      #   run: |
      #     kubectl -n jardimja set image deployment/api \
      #       api=${{ needs.build-images.outputs.api_image }}
      #     kubectl -n jardimja rollout status deployment/api --timeout=180s

