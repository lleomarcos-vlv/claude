<title>Núcleo Multinicho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:      #F4F6F5;
    --panel:       #FFFFFF;
    --panel-2:     #ECEFEE;
    --line:        #DDE2E0;
    --line-strong: #C3CBC8;
    --text:        #161F1C;
    --text-2:      #55605C;
    --text-3:      #7C8783;

    --primary:      var(--acc-l, #1B7A4B);
    --primary-ink:  var(--acc-l-ink, #135C39);
    --primary-soft: var(--acc-l-soft, #E3F1E9);
    --primary-on:   #FFFFFF;

    --ok:          #1F7A45;
    --ok-soft:     #E4F1E9;
    --warn:        #A9550B;
    --warn-soft:   #FAEEDF;
    --crit:        #B42318;
    --crit-soft:   #FBE9E7;

    --shadow:      0 1px 2px rgba(16, 28, 24, .06), 0 8px 24px rgba(16, 28, 24, .07);
    --shadow-lift: 0 2px 4px rgba(16, 28, 24, .09), 0 16px 38px rgba(16, 28, 24, .14);

    --display: "Archivo", "Segoe UI", system-ui, sans-serif;
    --body:    "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0E1413;
      --panel:       #161E1C;
      --panel-2:     #1D2725;
      --line:        #29332F;
      --line-strong: #3A4642;
      --text:        #E6EDEA;
      --text-2:      #A2AEAA;
      --text-3:      #7D8884;

      --primary:      var(--acc-d, #35A96B);
      --primary-ink:  var(--acc-d-ink, #4CC282);
      --primary-soft: var(--acc-d-soft, #16301F);
      --primary-on:   #07110C;

      --ok:        #47B77A;
      --ok-soft:   #14291C;
      --warn:      #E0913D;
      --warn-soft: #2C2013;
      --crit:      #E5675A;
      --crit-soft: #321A17;

      --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .34);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 16px 38px rgba(0, 0, 0, .5);
    }
  }

  :root[data-theme="dark"] {
    --ground:      #0E1413;
    --panel:       #161E1C;
    --panel-2:     #1D2725;
    --line:        #29332F;
    --line-strong: #3A4642;
    --text:        #E6EDEA;
    --text-2:      #A2AEAA;
    --text-3:      #7D8884;

    --primary:      var(--acc-d, #35A96B);
    --primary-ink:  var(--acc-d-ink, #4CC282);
    --primary-soft: var(--acc-d-soft, #16301F);
    --primary-on:   #07110C;

    --ok:        #47B77A;
    --ok-soft:   #14291C;
    --warn:      #E0913D;
    --warn-soft: #2C2013;
    --crit:      #E5675A;
    --crit-soft: #321A17;

    --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .34);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 16px 38px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-sm); }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  h1, h2, h3 { font-family: var(--display); letter-spacing: -.015em; margin: 0; }

  /* ============ Shell ============ */

  .shell { min-height: 100vh; display: grid; grid-template-columns: 216px minmax(0, 1fr); }

  .side {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
  }
  .logo .mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--primary);
    color: var(--primary-on);
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    flex: none;
    transition: background .2s ease;
  }
  .logo .txt { line-height: 1.1; min-width: 0; }
  .logo .txt b { font-family: var(--display); font-weight: 700; font-size: 15px; display: block; }
  .logo .txt span {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-3);
    font-weight: 600;
  }

  .nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .nav button {
    display: flex;
    align-items: center;
    gap: 11px;
    border: 0;
    background: transparent;
    color: var(--text-2);
    padding: 9px 11px;
    border-radius: var(--r-md);
    cursor: pointer;
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    text-align: left;
    width: 100%;
    transition: background .13s ease, color .13s ease;
  }
  .nav button svg { flex: none; opacity: .85; }
  .nav button:hover { background: var(--panel-2); color: var(--text); }
  .nav button[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); }
  .nav .badge {
    margin-left: auto;
    background: var(--warn-soft);
    color: var(--warn);
    border-radius: 100px;
    padding: 1px 7px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }

  .side-foot {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.4;
  }

  .content { display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 11px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  /* niche picker */
  .picker { position: relative; }
  .picker > button {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: var(--r-md);
    padding: 7px 12px 7px 10px;
    cursor: pointer;
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    transition: border-color .13s ease;
  }
  .picker > button:hover { border-color: var(--line-strong); }
  .picker .swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--primary); flex: none; }
  .picker .chev { color: var(--text-3); margin-left: 2px; }
  .picker .lbl-k {
    font-family: var(--body);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-3);
    font-weight: 600;
    display: block;
    line-height: 1;
    margin-bottom: 3px;
  }
  .picker .lbl-v { display: block; line-height: 1.1; }

  .picker-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    width: 290px;
    max-height: 62vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lift);
    padding: 6px;
  }
  .picker-menu .hd {
    padding: 8px 10px 6px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--text-3);
    font-weight: 600;
  }
  .picker-menu button {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 9px 10px;
    border-radius: var(--r-md);
    cursor: pointer;
    text-align: left;
  }
  .picker-menu button:hover { background: var(--panel-2); }
  .picker-menu button[aria-current="true"] { background: var(--primary-soft); }
  .picker-menu .dot { width: 11px; height: 11px; border-radius: 3px; margin-top: 5px; flex: none; }
  .picker-menu .nm { font-family: var(--display); font-weight: 600; font-size: 14px; display: block; }
  .picker-menu .dc { font-size: 12px; color: var(--text-3); display: block; line-height: 1.35; }

  .caixa {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px 5px 10px;
    border-radius: 100px;
    background: var(--ok-soft);
    color: var(--ok);
    font-size: 12.5px;
    font-weight: 600;
  }
  .caixa i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .stat { text-align: right; line-height: 1.15; }
  .stat .k {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .stat .v { font-size: 15px; font-weight: 600; }

  .page { padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .page-head h1 { font-size: 22px; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--text-2); font-size: 14px; }

  /* ============ Generic pieces ============ */

  .card-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 16px;
  }
  .card-box > h3 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .card-box > .hint { font-size: 12.5px; color: var(--text-3); margin: 0 0 14px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 15px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .kpi .k {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--text-3);
    font-weight: 600;
  }
  .kpi .v {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .kpi .d { font-size: 12.5px; color: var(--text-2); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-ok   { background: var(--ok-soft);   color: var(--ok); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-crit { background: var(--crit-soft); color: var(--crit); }
  .pill-mut  { background: var(--panel-2);   color: var(--text-2); }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    font-family: var(--body);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--text-3);
    font-weight: 600;
    padding: 0 12px 9px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  .strong { font-weight: 600; }
  .muted { color: var(--text-3); font-size: 12.5px; }

  .inlineinput {
    width: 96px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: var(--r-sm);
    padding: 6px 9px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 13.5px;
    text-align: right;
    outline: none;
  }
  .inlineinput:focus { border-color: var(--primary); }

  .searchbar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 0 13px;
    transition: border-color .13s ease;
    flex: 1;
    min-width: 0;
  }
  .searchbar:focus-within { border-color: var(--primary); }
  .searchbar svg { flex: none; color: var(--text-3); }
  .searchbar input { flex: 1; border: 0; background: transparent; padding: 11px 0; outline: none; min-width: 0; }
  .searchbar input::placeholder { color: var(--text-3); }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-2);
    border-radius: var(--r-md);
    padding: 9px 15px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: all .13s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); color: var(--text); }
  .btn-primary {
    border: 0;
    background: var(--primary);
    color: var(--primary-on);
    border-radius: var(--r-md);
    padding: 14px 18px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background .13s ease, transform .1s ease;
    width: 100%;
  }
  .btn-primary:hover { background: var(--primary-ink); }
  .btn-primary:active { transform: scale(.99); }
  .btn-primary[disabled] { background: var(--panel-2); color: var(--text-3); cursor: default; transform: none; }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-2);
    padding: 7px 14px;
    border-radius: 100px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all .13s ease;
  }
  .chips button:hover { border-color: var(--line-strong); color: var(--text); }
  .chips button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--ground); }

  .segmented { display: flex; gap: 3px; padding: 3px; background: var(--panel-2); border-radius: var(--r-md); }
  .segmented button {
    border: 0;
    background: transparent;
    padding: 7px 14px;
    border-radius: 7px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .13s ease, color .13s ease;
    white-space: nowrap;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(16, 28, 24, .12); }

  /* ============ Painel / chart ============ */

  .panel-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }

  .chart { position: relative; }
  .chart-bars { display: flex; align-items: flex-end; gap: 2px; height: 168px; }
  .cbar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: default; position: relative; }
  .cbar .fill {
    background: var(--primary);
    border-radius: 4px 4px 0 0;
    transition: opacity .13s ease;
    min-height: 3px;
  }
  .chart-bars:hover .cbar .fill { opacity: .45; }
  .chart-bars .cbar:hover .fill { opacity: 1; }
  .chart-x { display: flex; gap: 2px; margin-top: 8px; }
  .chart-x span {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .chart-x span[data-hoje="1"] { color: var(--text); }
  .chart-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    color: var(--text-3);
    border-bottom: 1px dashed var(--line);
    padding-bottom: 5px;
    margin-bottom: 9px;
    font-family: var(--mono);
  }
  .tip {
    position: absolute;
    z-index: 10;
    background: var(--text);
    color: var(--ground);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12.5px;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow);
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity .12s ease;
  }
  .tip[data-show="1"] { opacity: 1; }
  .tip .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .toplist { display: flex; flex-direction: column; gap: 11px; }
  .toprow { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; }
  .toprow .nm { font-size: 13.5px; font-weight: 500; }
  .toprow .vl { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 600; }
  .toprow .bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .toprow .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }

  /* ============ PDV ============ */

  .pdv { display: grid; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; min-height: 0; }
  .catalog { padding: 18px; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .catrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 10px; }

  .card {
    position: relative;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 13px 13px 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 104px;
    transition: transform .11s ease, border-color .13s ease, box-shadow .13s ease;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .card:active { transform: scale(.985); }
  .card[data-in="1"] { border-color: var(--primary); }
  .card[data-out="1"] { opacity: .48; cursor: not-allowed; }

  .card .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--text-3); }
  .card .name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.25;
    margin-top: -3px;
    text-wrap: balance;
  }
  .card .price {
    margin-top: auto;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .card .price em { font-style: normal; font-family: var(--body); font-size: 11px; color: var(--text-3); font-weight: 500; }
  .card .qty {
    position: absolute;
    top: 9px; right: 9px;
    min-width: 23px; height: 23px;
    padding: 0 6px;
    border-radius: 100px;
    background: var(--primary);
    color: var(--primary-on);
    font-family: var(--mono);
    font-weight: 600;
    font-size: 12px;
    display: grid;
    place-items: center;
  }
  .card .flag {
    position: absolute;
    top: 9px; right: 9px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--warn);
    background: var(--warn-soft);
    padding: 2px 7px;
    border-radius: 100px;
  }
  .empty-grid { grid-column: 1 / -1; padding: 44px 10px; text-align: center; color: var(--text-3); }

  .ticket {
    position: sticky;
    top: 57px;
    height: calc(100vh - 57px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
  }
  .ticket-head { padding: 15px 17px 12px; border-bottom: 1px dashed var(--line-strong); }
  .ticket-head .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ticket-head h2 { font-size: 15.5px; font-weight: 700; }
  .ticket-head .sub { margin: 3px 0 0; font-size: 12px; color: var(--text-3); }

  .items { flex: 1; overflow-y: auto; min-height: 0; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 10px 17px; border-bottom: 1px solid var(--line); }
  .item .nm { font-weight: 500; font-size: 14px; line-height: 1.3; }
  .item .det { font-size: 11.5px; color: var(--primary-ink); font-weight: 500; }
  .item .unit { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .item .amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; text-align: right; }
  .item .stepper { grid-column: 2; display: flex; align-items: center; gap: 2px; justify-self: end; }
  .item .obsbtn {

    return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v || 0);
  }
  function parseValor(txt) {
    var s = String(txt).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {

    });

  function seeded(n) { var x = Math.sin(n * 9973.13) * 10000; return x - Math.floor(x); }

    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(hex, target, amt) {
    var a = hex2rgb(hex), b = hex2rgb(target);
    var r = a.map(function (v, i) { return Math.round(v + (b[i] - v) * amt); });
    return "#" + r.map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("");
  }

  /* =======================================================================

  function aplicarCor(hex) {
    var r = document.documentElement.style;
    r.setProperty("--acc-l", hex);
    r.setProperty("--acc-l-ink", mix(hex, "#000000", .22));
    r.setProperty("--acc-l-soft", mix(hex, "#FFFFFF", .90));
    r.setProperty("--acc-d", mix(hex, "#FFFFFF", .36));
    r.setProperty("--acc-d-ink", mix(hex, "#FFFFFF", .52));

  }

  function carregar(id) {
    V = VERTICAIS.filter(function (v) { return v.id === id; })[0] || VERTICAIS[0];
    aplicarCor(V.cor);

    produtos = V.prods.map(function (p, i) {
      return { id: i + 1, cat: p[0], nome: p[1], preco: p[2], pede: p[3] || null };
    });

    estoque = {};
    produtos.forEach(function (p) {
      // serviços não têm estoque físico
      var servico = p.cat === "Serviços" || (V.id === "beleza" && p.cat !== "Produtos");
      estoque[p.id] = servico ? null : Math.round(2 + seeded(p.id * 7 + V.nome.length) * 60);
    });

    clientes = NOMES.slice(0, 8).map(function (n, i) {
      var s = seeded(i * 31 + V.nome.length);
      return {
        nome: n,
        desde: 2019 + Math.floor(s * 6),
        compras: 3 + Math.round(s * 40),
        total: Math.round((180 + s * 4200) * 100) / 100
      };
    }).sort(function (a, b) { return b.total - a.total; });

    financeiro = [];
    for (var i = 0; i < 6; i++) {

      financeiro.push({
        tipo: i % 2 === 0 ? "receber" : "pagar",

        dia: ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"][(new Date().getDay() - d + 7) % 7],
        valor: Math.round(base * (.55 + sd * .95))

  function subtotal() {
    return state.itens.reduce(function (s, i) { return s + i.preco * i.qtd; }, 0);
  }
  function descontoValor() { return subtotal() * state.desconto; }
  function servicoValor() {
    return (state.servico && V.flags.servicoEm === state.modo) ? (subtotal() - descontoValor()) * 0.10 : 0;
  }
  function entregaValor() {
    return (V.flags.entregaEm === state.modo && state.itens.length) ? V.flags.entrega : 0;
  }
  function comissaoValor() {
    if (!V.flags.comissao) return 0;
    return state.itens.reduce(function (s, i) {
      return s + (i.det && i.det.prof ? i.preco * i.qtd * V.flags.comissao : 0);
    }, 0);
  }
  function total() { return subtotal() - descontoValor() + servicoValor() + entregaValor(); }

  function renderPainel() {
    var hist = historico.slice();
    hist[hist.length - 1] = { dia: hist[hist.length - 1].dia, valor: hist[hist.length - 1].valor + state.faturamento };

              "</tbody></table></div>" +

            "<h3>Mais vendidos hoje</h3>" +

  function ligarChart(hist) {
    var bars = el("bars"), tip = el("tip");
    if (!bars) return;

    function mostrar(bar) {
      var i = Number(bar.getAttribute("data-i"));
      var h = hist[i];
      tip.innerHTML = "<span>" + esc(i === hist.length - 1 ? "Hoje" : h.dia) + '</span> · <span class="n">' + money(h.valor) + "</span>";
      tip.setAttribute("data-show", "1");
      var br = bar.getBoundingClientRect(), cr = bars.parentElement.getBoundingClientRect();
      var fill = bar.querySelector(".fill").getBoundingClientRect();
      tip.style.left = (br.left - cr.left + br.width / 2) + "px";
      tip.style.top = (fill.top - cr.top - 8) + "px";
    }
    function esconder() { tip.removeAttribute("data-show"); }

    bars.addEventListener("mousemove", function (e) {
      var b = e.target.closest(".cbar");
      if (b) mostrar(b); else esconder();
    });
    bars.addEventListener("mouseleave", esconder);
    bars.addEventListener("focusin", function (e) {
      var b = e.target.closest(".cbar");
      if (b) mostrar(b);
    });
    bars.addEventListener("focusout", esconder);

            "</label>" +
            '<div class="segmented" id="modos" role="group" aria-label="Tipo de atendimento">' +
              V.modos.map(function (m) {
                return '<button type="button" data-modo="' + esc(m) + '" aria-pressed="' + (m === state.modo) + '">' + esc(m) + "</button>";
              }).join("") +
            "</div>" +
          "</div>" +
          '<div class="chips" id="cats" role="group" aria-label="Categorias"></div>' +
          '<div class="grid" id="grid"></div>' +
        "</section>" +

        '<aside class="ticket" id="ticket" aria-label="' + esc(V.termos.doc) + '">' +
          '<div class="ticket-head"><div class="row">' +
            '<div><h2 id="tk-title"></h2><p class="sub" id="tk-sub"></p></div>' +
            '<button type="button" class="closebtn" id="fechar-tk" aria-label="Fechar">×</button>' +
          "</div></div>" +
          '<div class="items" id="items"></div>' +
          '<div class="totals" id="totals"></div>' +
        "</aside>" +
      "</div>";

    el("busca").value = state.busca;
    el("busca").addEventListener("input", function () { state.busca = this.value; renderGrid(); });

    el("modos").addEventListener("click", function (e) {
      var b = e.target.closest("[data-modo]");
      if (!b) return;
      state.modo = b.getAttribute("data-modo");
      Array.prototype.forEach.call(this.children, function (c) {
        c.setAttribute("aria-pressed", c === b ? "true" : "false");
      });
      renderTicket();
    });

    el("cats").addEventListener("click", function (e) {
      var b = e.target.closest("[data-cat]");
      if (!b) return;
      state.categoria = b.getAttribute("data-cat");
      renderCats();
      renderGrid();
    });

    el("grid").addEventListener("click", function (e) {
      var b = e.target.closest("[data-add]");
      if (b && !b.disabled) pedirEAdicionar(Number(b.getAttribute("data-add")));
    });

    el("items").addEventListener("click", function (e) {
      var i = e.target.closest("[data-inc]");
      if (i) return mudarQtd(Number(i.getAttribute("data-inc")), 1);
      var d = e.target.closest("[data-dec]");
      if (d) return mudarQtd(Number(d.getAttribute("data-dec")), -1);
      var o = e.target.closest("[data-obs]");
      if (o) return editarObs(Number(o.getAttribute("data-obs")));
    });

    el("fechar-tk").addEventListener("click", function () { el("ticket").removeAttribute("data-open"); });

    renderCats();
    renderGrid();
    renderTicket();
  }

  function renderCats() {
    el("cats").innerHTML = categorias().map(function (c) {
      return '<button type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === state.categoria) + '">' + esc(c) + "</button>";
    }).join("");
  }

  function renderGrid() {
    var lista = visiveis();
    if (!lista.length) {
      el("grid").innerHTML = '<p class="empty-grid">Nenhum produto encontrado para essa busca.</p>';
      return;
    }
    el("grid").innerHTML = lista.map(function (p) {
      var q = qtdNoCarrinho(p.id);
      var est = estoque[p.id];
      var sem = est !== null && est <= 0;
      var canto = q
        ? '<span class="qty">' + fmtNum(q, p.pede === "peso" ? 3 : p.pede === "area" ? 2 : 0) + "</span>"
        : (sem ? '<span class="flag">Sem estoque</span>' : "");
      return '<button type="button" class="card" data-add="' + p.id + '"' +
        (q ? ' data-in="1"' : "") + (sem ? ' data-out="1" disabled' : "") + ">" +
        canto +
        '<span class="eyebrow">' + esc(p.cat) + "</span>" +
        '<span class="name">' + esc(p.nome) + "</span>" +
        '<span class="price">' + money(p.preco) + (unidade(p) ? "<em>" + unidade(p) + "</em>" : "") + "</span>" +
      "</button>";
    }).join("");
  }

  function renderTicket(flash) {
    var box = el("items");
    if (!box) return;

    if (!state.itens.length) {
      box.innerHTML = '<div class="ticket-empty"><strong>' + esc(V.termos.doc) + " vazi" +
        (V.termos.doc === "Comanda" ? "a" : "o") + "</strong>" +
        "<span>Toque nos produtos ao lado para lançar o atendimento.</span></div>";
    } else {
      box.innerHTML = state.itens.map(function (i) {
        var dec = i.pede === "peso" ? 3 : i.pede === "area" ? 2 : 0;
        var passo = i.pede === "peso" || i.pede === "area";
        return '<div class="item' + (i.uid === flash ? " item-flash" : "") + '">' +
          '<div><div class="nm">' + esc(i.nome) + "</div>" +
          (i.resumo ? '<div class="det">' + esc(i.resumo) + "</div>" : "") +
          '<div class="unit">' + money(i.preco) + (unidade(i) || " un") + "</div></div>" +
          '<div class="amt">' + money(i.preco * i.qtd) + "</div>" +
          (V.flags.obs && !i.resumo ? '<button type="button" class="obsbtn" data-obs="' + i.uid + '">+ observação</button>' : "") +
          '<div class="stepper">' +
            '<button type="button" data-dec="' + i.uid + '" aria-label="Diminuir">−</button>' +
            '<span class="n">' + fmtNum(i.qtd, dec) + (passo ? (i.pede === "peso" ? " kg" : " m²") : "") + "</span>" +
            '<button type="button" data-inc="' + i.uid + '" aria-label="Aumentar">+</button>' +
          "</div></div>";
      }).join("");
    }

    var nItens = state.itens.reduce(function (s, i) { return s + (i.pede ? 1 : i.qtd); }, 0);
    el("tk-title").textContent = state.modo + " · " + V.termos.doc + " #" + state.doc;
    el("tk-sub").textContent = nItens ? nItens + (nItens === 1 ? " item lançado" : " itens lançados") : "Nenhum item lançado";

    renderTotais();
    el("m-count").textContent = nItens;
    el("m-total").textContent = money(total());
  }

  function renderTotais() {
    var linhas = '<div class="trow"><span>Subtotal</span><span class="num">' + money(subtotal()) + "</span></div>";

    linhas += '<div class="trow"><span>Desconto</span>' +
      '<span style="display:flex;align-items:center;gap:8px">' +
        '<span class="segmented" id="descs">' +
          [0, .05, .10].map(function (d) {
            return '<button type="button" data-desc="' + d + '" aria-pressed="' + (state.desconto === d) +
              '" style="padding:4px 9px;font-size:12px">' + (d * 100) + "%</button>";
          }).join("") +
        "</span>" +
        '<span class="num">−' + money(descontoValor()) + "</span>" +
      "</span></div>";

    if (V.flags.servicoEm === state.modo) {
      linhas += '<div class="trow"><label class="toggle"><input type="checkbox" id="sv"' +
        (state.servico ? " checked" : "") + '><span class="track"></span><span>Taxa de serviço 10%</span></label>' +
        '<span class="num">' + money(servicoValor()) + "</span></div>";
    }
    if (V.flags.entregaEm === state.modo) {
      linhas += '<div class="trow"><span>Taxa de entrega</span><span class="num">' + money(entregaValor()) + "</span></div>";
    }
    if (V.flags.comissao && comissaoValor()) {
      linhas += '<div class="trow"><span>Comissão dos profissionais</span><span class="num">' + money(comissaoValor()) + "</span></div>";
    }

    linhas += '<div class="total-final"><span class="lbl">Total</span>' +
      '<span class="val" id="tot" aria-live="polite">' + money(total()) + "</span></div>";

    linhas += '<button type="button" class="btn-primary" id="fechar"' + (state.itens.length ? "" : " disabled") + ">" +
      esc(V.termos.acao) + "</button>";
    linhas += '<button type="button" class="linkbtn" id="limpar" style="align-self:center"' +
      (state.itens.length ? "" : " disabled") + ">Cancelar " + esc(V.termos.doc.toLowerCase()) + "</button>";

    el("totals").innerHTML = linhas;

    el("descs").addEventListener("click", function (e) {
      var b = e.target.closest("[data-desc]");
      if (!b) return;
      state.desconto = Number(b.getAttribute("data-desc"));
      renderTicket();
    });
    if (el("sv")) el("sv").addEventListener("change", function () { state.servico = this.checked; renderTicket(); });
    el("fechar").addEventListener("click", abrirPagamento);
    el("limpar").addEventListener("click", function () {
      state.itens = []; state.desconto = 0; state.servico = false;
      renderGrid(); renderTicket(); toast(V.termos.doc + " cancelad" + (V.termos.doc === "Comanda" ? "a" : "o") + ".");
    });
  }

  /* ---------- lançar item ---------- */

  var uidSeq = 1;

  function pedirEAdicionar(pid) {
    var p = produtos.filter(function (x) { return x.id === pid; })[0];
    if (!p) return;
    if (!p.pede) return adicionar(p, 1, null);
    abrirCampos(p);
  }

  function adicionar(p, qtd, det) {
    var resumo = det && p.pede ? PEDE[p.pede].resumo(det) : null;

    // itens sem campos especiais se agrupam; com campos, cada lançamento é uma linha
    if (!p.pede) {
      var ex = state.itens.filter(function (i) { return i.pid === p.id && !i.resumo; })[0];
      if (ex) { ex.qtd += qtd; renderGrid(); renderTicket(ex.uid); return; }
    }

    var it = {
      uid: uidSeq++, pid: p.id, nome: p.nome, preco: p.preco,
      qtd: qtd, pede: p.pede, det: det, resumo: resumo
    };
    state.itens.push(it);
    renderGrid();
    renderTicket(it.uid);
  }

  function mudarQtd(uid, delta) {
    var idx = -1;
    state.itens.forEach(function (i, k) { if (i.uid === uid) idx = k; });
    if (idx === -1) return;
    var it = state.itens[idx];
    var passo = (it.pede === "peso") ? 0.100 : (it.pede === "area") ? 0.50 : 1;
    it.qtd = Math.round((it.qtd + delta * passo) * 1000) / 1000;
    if (it.qtd <= 0) state.itens.splice(idx, 1);
    renderGrid();
    renderTicket();
  }

  function editarObs(uid) {
    var it = state.itens.filter(function (i) { return i.uid === uid; })[0];
    if (!it) return;
    abrirModal({
      titulo: "Observação do item",
      campos: PEDE.obs.campos(),
      valores: {},
      onOk: function (v) {
        if (!v.obs) return;
        it.resumo = v.obs;
        it.det = v;
        renderTicket(uid);
      }
    });
  }

  function abrirCampos(p) {
    var spec = PEDE[p.pede];
    abrirModal({
      titulo: spec.titulo,
      sub: p.nome + " · " + money(p.preco) + (unidade(p) || ""),
      campos: spec.campos(p),
      valores: {},
      onOk: function (v) {
        var qtd = spec.qtd ? spec.qtd(v) : 1;
        if (!qtd || qtd <= 0) { toast("Informe um valor maior que zero."); return false; }
        adicionar(p, qtd, v);
      }
    });
  }

  /* =======================================================================
     10. Modal genérico
     ======================================================================= */

  var modalCtx = null;

  function abrirModal(cfg) {
    modalCtx = { valores: {}, campos: cfg.campos, onOk: cfg.onOk };

    cfg.campos.forEach(function (c) {
      modalCtx.valores[c.k] = c.valor !== undefined ? c.valor : (c.tipo === "opt" ? c.op[Math.floor(c.op.length / 2)] : "");
    });

    var html = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="md-t">' +
      '<h3 id="md-t">' + esc(cfg.titulo) + "</h3>" +
      (cfg.sub ? '<p class="muted" style="margin:-10px 0 0">' + esc(cfg.sub) + "</p>" : "");

    cfg.campos.forEach(function (c) {
      html += '<div class="field"><span class="field-label">' + esc(c.l) + "</span>";
      if (c.tipo === "opt") {
        html += '<div class="optrow" data-opt="' + c.k + '">' + c.op.map(function (o) {
          return '<button type="button" data-v="' + esc(o) + '" aria-pressed="' + (o === modalCtx.valores[c.k]) + '">' + esc(o) + "</button>";
        }).join("") + "</div>";
      } else {
        html += '<input class="txtin' + (c.tipo === "numero" ? " mono" : "") + '" data-in="' + c.k +
          '" type="text"' + (c.tipo === "numero" ? ' inputmode="decimal"' : "") +
          ' value="' + esc(modalCtx.valores[c.k]) + '" placeholder="' + esc(c.ph || "") + '">';
      }
      html += "</div>";
    });

    html += '<div class="modal-actions"><button type="button" class="btn" data-cancel>Voltar</button>' +
      '<button type="button" class="btn-primary" data-ok>Lançar</button></div></div>';

    el("modal-root").innerHTML = html;
    el("modal-root").hidden = false;

    var first = el("modal-root").querySelector('input, [data-opt] button');
    if (first) first.focus();
  }

  function fecharModal() {
    el("modal-root").hidden = true;
    el("modal-root").innerHTML = "";
    modalCtx = null;
  }

  el("modal-root").addEventListener("click", function (e) {
    if (e.target === this) return fecharModal();
    if (!modalCtx) return;

    var opt = e.target.closest("[data-opt] button");
    if (opt) {
      var wrap = opt.parentElement;
      modalCtx.valores[wrap.getAttribute("data-opt")] = opt.getAttribute("data-v");
      Array.prototype.forEach.call(wrap.children, function (c) {
        c.setAttribute("aria-pressed", c === opt ? "true" : "false");
      });
      return;
    }
    if (e.target.closest("[data-cancel]")) return fecharModal();
    if (e.target.closest("[data-ok]")) return confirmarModal();
  });

  el("modal-root").addEventListener("input", function (e) {
    if (!modalCtx) return;
    var i = e.target.closest("[data-in]");
    if (!i) return;
    var k = i.getAttribute("data-in");
    var c = modalCtx.campos.filter(function (x) { return x.k === k; })[0];
    modalCtx.valores[k] = c && c.tipo === "numero" ? parseValor(i.value) : i.value;
  });

  function confirmarModal() {
    var ctx = modalCtx;
    if (!ctx) return;
    var r = ctx.onOk(ctx.valores);
    if (r !== false) fecharModal();
  }

  /* =======================================================================
     11. Pagamento
     ======================================================================= */

  function abrirPagamento() {
    if (!state.itens.length) return;
    state.pagamento = "Dinheiro";
    state.recebido = 0;

    var formas = ["Dinheiro", "Cartão", "Pix"];
    if (V.flags.prazo) formas.push("A prazo");

    el("modal-root").innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pg-t">' +
        '<h3 id="pg-t">Pagamento · ' + esc(V.termos.doc) + " #" + state.doc + "</h3>" +
        '<div class="due"><span class="k">Total a receber</span><span class="v">' + money(total()) + "</span></div>" +
        '<div><span class="field-label">Forma de pagamento</span>' +
          '<div class="pays" id="pays">' + formas.map(function (f) {
            return '<button type="button" data-pay="' + esc(f) + '" aria-pressed="' + (f === "Dinheiro") + '">' + esc(f) + "</button>";
          }).join("") + "</div></div>" +
        '<div id="cash"><span class="field-label">Valor recebido</span>' +
          '<input class="txtin mono" id="recebido" type="text" inputmode="decimal" placeholder="0,00">' +
          '<div class="quick" id="quick"></div>' +
          '<div class="troco" id="troco"><span>Troco</span><span class="v" id="troco-v">' + money(0) + "</span></div>" +
        "</div>" +
        '<div class="modal-actions"><button type="button" class="btn" id="pg-x">Voltar</button>' +
        '<button type="button" class="btn-primary" id="pg-ok">Confirmar pagamento</button></div>' +
      "</div>";

    el("modal-root").hidden = false;
    modalCtx = null;

    renderQuick();
    renderTroco();

    el("pays").addEventListener("click", function (e) {
      var b = e.target.closest("[data-pay]");
      if (!b) return;
      state.pagamento = b.getAttribute("data-pay");
      Array.prototype.forEach.call(this.children, function (c) {
        c.setAttribute("aria-pressed", c === b ? "true" : "false");
      });
      el("cash").hidden = state.pagamento !== "Dinheiro";
    });
    el("recebido").addEventListener("input", function () { state.recebido = parseValor(this.value); renderTroco(); });
    el("quick").addEventListener("click", function (e) {
      var b = e.target.closest("[data-q]");
      if (!b) return;
      state.recebido = Number(b.getAttribute("data-q"));
      el("recebido").value = state.recebido.toFixed(2).replace(".", ",");
      renderTroco();
    });
    el("pg-x").addEventListener("click", fecharModal);
    el("pg-ok").addEventListener("click", confirmarPagamento);
    el("recebido").focus();
  }

  function renderQuick() {
    var t = total(), ops = [t];
    [20, 50, 100, 200, 500].forEach(function (v) { if (v > t && ops.length < 4) ops.push(v); });
    el("quick").innerHTML = ops.map(function (v, i) {
      return '<button type="button" data-q="' + v + '">' + (i === 0 ? "Valor exato" : money(v)) + "</button>";
    }).join("");
  }

  function renderTroco() {
    var dif = state.recebido - total(), box = el("troco");
    if (!box) return;
    if (dif >= 0) {
      box.removeAttribute("data-short");
      box.firstElementChild.textContent = "Troco";
      el("troco-v").textContent = money(dif);
    } else {
      box.setAttribute("data-short", "1");
      box.firstElementChild.textContent = "Falta receber";
      el("troco-v").textContent = money(Math.abs(dif));
    }
  }

  function confirmarPagamento() {
    if (state.pagamento === "Dinheiro" && state.recebido < total() - 0.001) {
      toast("Valor recebido é menor que o total.");
      el("recebido").focus();
      return;
    }

    var t = total(), forma = state.pagamento;

    state.itens.forEach(function (i) {
      if (estoque[i.pid] !== null) estoque[i.pid] = Math.max(0, Math.round((estoque[i.pid] - i.qtd) * 1000) / 1000);
      state.ranking[i.nome] = (state.ranking[i.nome] || 0) + i.preco * i.qtd;
      state.itensVendidos += i.qtd;
    });

    state.vendas += 1;
    state.faturamento += t;
    state.doc += 1;
    state.itens = [];
    state.desconto = 0;
    state.servico = false;

    fecharModal();
    renderStats();
    renderNav();
    renderGrid();
    renderTicket();
    var tk = el("ticket");
    if (tk) tk.removeAttribute("data-open");
    toast(V.termos.doc + " #" + (state.doc - 1) + " · " + money(t) + " · " + forma);
  }

  /* =======================================================================
     12. Catálogo · Estoque · Clientes · Financeiro
     ======================================================================= */

  function renderCatalogo() {
    el("view").innerHTML =
      '<div class="page">' +
        '<div class="page-head"><h1>Catálogo</h1>' +
        "<p>" + produtos.length + " itens cadastrados no kit " + esc(V.nome) + ". Altere o preço direto na tabela.</p></div>" +
        '<div class="card-box"><div class="tablewrap"><table>' +
          "<thead><tr><th>Produto</th><th>Categoria</th><th>Campo especial</th>" +
          '<th class="r">Estoque</th><th class="r">Preço</th></tr></thead><tbody id="cat-body">' +
          produtos.map(function (p) {
            var est = estoque[p.id];
            return "<tr><td class=\"strong\">" + esc(p.nome) + "</td>" +
              "<td>" + esc(p.cat) + "</td>" +
              "<td>" + (p.pede ? '<span class="pill pill-mut">' + esc(PEDE[p.pede].titulo) + "</span>" : '<span class="muted">—</span>') + "</td>" +
              '<td class="r num">' + (est === null ? '<span class="muted">serviço</span>' : fmtNum(est, 0)) + "</td>" +
              '<td class="r"><input class="inlineinput" data-preco="' + p.id + '" value="' +
                p.preco.toFixed(2).replace(".", ",") + '" aria-label="Preço de ' + esc(p.nome) + '"></td></tr>';
          }).join("") +
        "</tbody></table></div></div>" +
      "</div>";

    el("cat-body").addEventListener("change", function (e) {
      var i = e.target.closest("[data-preco]");
      if (!i) return;
      var id = Number(i.getAttribute("data-preco"));
      var novo = parseValor(i.value);
      var p = produtos.filter(function (x) { return x.id === id; })[0];
      if (!p || novo <= 0) { i.value = p.preco.toFixed(2).replace(".", ","); return; }
      p.preco = novo;
      i.value = novo.toFixed(2).replace(".", ",");
      toast(p.nome + " agora custa " + money(novo));
    });
  }

  function renderEstoque() {
    var lista = produtos.filter(function (p) { return estoque[p.id] !== null; })
      .sort(function (a, b) { return estoque[a.id] - estoque[b.id]; });
    var criticos = baixos().length;

    el("view").innerHTML =
      '<div class="page">' +
        '<div class="page-head"><h1>Estoque</h1>' +
        "<p>" + (criticos ? criticos + " item(ns) no nível de reposição." : "Nenhum item em nível crítico.") +
        " O estoque baixa sozinho a cada venda fechada.</p></div>" +
        '<div class="card-box"><div class="tablewrap"><table>' +
          "<thead><tr><th>Produto</th><th>Categoria</th><th>Situação</th>" +
          '<th class="r">Saldo</th><th class="r">Ajuste</th></tr></thead><tbody id="est-body">' +
          lista.map(function (p) {
            var e = estoque[p.id];
            var pill = e <= 0 ? '<span class="pill pill-crit">Zerado</span>'
              : e <= 8 ? '<span class="pill pill-warn">Repor</span>'
              : '<span class="pill pill-ok">Normal</span>';
            return "<tr><td class=\"strong\">" + esc(p.nome) + "</td><td>" + esc(p.cat) + "</td>" +
              "<td>" + pill + '</td><td class="r num strong">' + fmtNum(e, 0) + "</td>" +
              '<td class="r"><span class="stepper" style="justify-content:flex-end">' +
                '<button type="button" data-est="' + p.id + '" data-d="-1" aria-label="Baixar">−</button>' +
                '<button type="button" data-est="' + p.id + '" data-d="10" aria-label="Entrada de 10">+10</button>' +
              "</span></td></tr>";
          }).join("") +
        "</tbody></table></div></div>" +
      "</div>";

    el("est-body").addEventListener("click", function (e) {
      var b = e.target.closest("[data-est]");
      if (!b) return;
      var id = Number(b.getAttribute("data-est"));
      estoque[id] = Math.max(0, estoque[id] + Number(b.getAttribute("data-d")));
      renderEstoque();
      renderNav();
    });
  }

  function renderClientes() {
    el("view").innerHTML =
      '<div class="page">' +
        '<div class="page-head"><h1>Clientes</h1><p>Base compartilhada pelo núcleo — igual em todos os nichos.</p></div>' +
        '<div class="card-box"><div class="tablewrap"><table>' +
          "<thead><tr><th>Cliente</th><th>Cliente desde</th>" +
          '<th class="r">Compras</th><th class="r">Total gasto</th><th class="r">Ticket médio</th></tr></thead><tbody>' +
          clientes.map(function (c) {
            return "<tr><td class=\"strong\">" + esc(c.nome) + "</td><td>" + c.desde + "</td>" +
              '<td class="r num">' + c.compras + '</td><td class="r num strong">' + money(c.total) + "</td>" +
              '<td class="r num">' + money(c.total / c.compras) + "</td></tr>";
          }).join("") +
        "</tbody></table></div></div>" +
      "</div>";
  }

  function renderFinanceiro() {
    var rec = financeiro.filter(function (f) { return f.tipo === "receber"; });
    var pag = financeiro.filter(function (f) { return f.tipo === "pagar"; });
    var sr = rec.reduce(function (s, f) { return s + f.valor; }, 0);
    var sp = pag.reduce(function (s, f) { return s + f.valor; }, 0);

    function tabela(lista) {
      return '<div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Vencimento</th>' +
        '<th class="r">Valor</th></tr></thead><tbody>' +
        lista.map(function (f) {
          return "<tr><td class=\"strong\">" + esc(f.desc) +
            (f.atraso ? ' <span class="pill pill-crit">Em atraso</span>' : "") + "</td>" +
            "<td>" + esc(f.venc) + '</td><td class="r num strong">' + money(f.valor) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }

    el("view").innerHTML =
      '<div class="page">' +
        '<div class="page-head"><h1>Financeiro</h1><p>Contas a receber e a pagar do período.</p></div>' +
        '<div class="kpis">' +
          kpi("A receber", money(sr), rec.length + " lançamentos") +
          kpi("A pagar", money(sp), pag.length + " lançamentos") +
          kpi("Saldo previsto", money(sr - sp), sr - sp >= 0 ? "resultado positivo" : "atenção ao caixa") +
          kpi("Caixa de hoje", money(state.faturamento), state.vendas + " vendas fechadas") +
        "</div>" +
        '<div class="panel-grid">' +
          '<section class="card-box"><h3>A receber</h3><p class="hint">Vendas a prazo e convênios.</p>' + tabela(rec) + "</section>" +
          '<section class="card-box"><h3>A pagar</h3><p class="hint">Fornecedores e despesas fixas.</p>' + tabela(pag) + "</section>" +
        "</div>" +
      "</div>";
  }

  /* =======================================================================
     13. Toast, picker e eventos globais
     ======================================================================= */

  var tt = null;
  function toast(msg) {
    el("toast-msg").textContent = msg;
    el("toast").setAttribute("data-show", "1");
    clearTimeout(tt);
    tt = setTimeout(function () { el("toast").removeAttribute("data-show"); }, 3400);
  }

  el("nav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mod]");
    if (!b) return;
    state.modulo = b.getAttribute("data-mod");
    render();
    window.scrollTo(0, 0);
  });

  function renderPicker() {
    el("picker-menu").innerHTML = '<div class="hd">Nichos disponíveis</div>' +
      VERTICAIS.map(function (v) {
        return '<button type="button" role="option" data-v="' + v.id + '" aria-current="' + (V && v.id === V.id) + '">' +
          '<span class="dot" style="background:' + v.cor + '"></span>' +
          '<span><span class="nm">' + esc(v.nome) + '</span><span class="dc">' + esc(v.desc) + "</span></span></button>";
      }).join("");
  }

  function abrirPicker(abrir) {
    el("picker-menu").hidden = !abrir;
    el("picker-btn").setAttribute("aria-expanded", String(abrir));
    if (abrir) renderPicker();
  }

  el("picker-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    abrirPicker(el("picker-menu").hidden);
  });

  el("picker-menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-v]");
    if (!b) return;
    abrirPicker(false);
    carregar(b.getAttribute("data-v"));
    toast("Kit " + V.nome + " carregado.");
  });

  document.addEventListener("click", function () { abrirPicker(false); });

  el("open-ticket").addEventListener("click", function () {
    var t = el("ticket");
    if (t) t.setAttribute("data-open", "1");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!el("modal-root").hidden) return fecharModal();
    if (!el("picker-menu").hidden) return abrirPicker(false);
    var t = el("ticket");
    if (t) t.removeAttribute("data-open");
  });

  carregar("food");
})();
</script>
