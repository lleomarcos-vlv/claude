# ─────────────────────────────────────────────────────────────────────────────
# nginx config for the JardimJá Admin SPA (React + Vite static build).
# Listens on 8080 so the container can run as a non-root user.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── gzip compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN"            always;
    add_header X-Content-Type-Options       "nosniff"               always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection             "0"                     always;
    add_header Permissions-Policy           "geolocation=(self), camera=(), microphone=()" always;
    # HSTS is set at the edge/ALB where TLS terminates; enable here only if this
    # container terminates TLS itself.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── liveness probe ──────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── hashed static assets: cache hard, they are content-addressed ─────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback: every unknown route serves index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, so deploys take effect at once.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Don't leak the nginx version.
    server_tokens off;
}
